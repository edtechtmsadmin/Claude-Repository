<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <title>Phil-IRI Recorder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <style>
/* Phil-IRI Recorder
   Type: Lexend, a face designed to make reading easier.
   Colour: school blue with a pencil-yellow accent on a cool paper ground.
   Reading levels keep their own colours: green, amber, red. */
:root {
  --ground: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #eef2f9;
  --ink: #18202e;
  --muted: #5b6579;
  --line: #e0e5ee;
  --line-strong: #c7cfdd;
  --accent: #2552b8;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --pencil: #f3c33b;
  --pencil-soft: #fdf3d3;
  --sure: #1d8756;
  --sure-soft: #e2f4ea;
  --check: #b87700;
  --check-soft: #fbf0d9;
  --missing: #c23e2c;
  --missing-soft: #fbe6e2;
  --focus: #2f64da;
  --shadow-sm: 0 1px 2px rgba(20, 33, 61, .06);
  --shadow: 0 1px 2px rgba(20, 33, 61, .05), 0 8px 24px rgba(20, 33, 61, .07);
  --font: "Lexend", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #10141c; --surface: #171d28; --surface-2: #1c2330; --surface-3: #222b3a; --ink: #e6ebf4; --muted: #9aa5b8;
    --line: #283244; --line-strong: #3a4659; --accent: #7aa2ff; --accent-ink: #0d1424; --accent-soft: #1f2c47;
    --pencil: #f3c33b; --pencil-soft: #3a3217; --sure: #5fd39a; --sure-soft: #173226; --check: #f0b54a; --check-soft: #3a2e14;
    --missing: #ff8b7a; --missing-soft: #3d1d19; --focus: #8fb1ff;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #10141c; --surface: #171d28; --surface-2: #1c2330; --surface-3: #222b3a; --ink: #e6ebf4; --muted: #9aa5b8;
  --line: #283244; --line-strong: #3a4659; --accent: #7aa2ff; --accent-ink: #0d1424; --accent-soft: #1f2c47;
  --pencil: #f3c33b; --pencil-soft: #3a3217; --sure: #5fd39a; --sure-soft: #173226; --check: #f0b54a; --check-soft: #3a2e14;
  --missing: #ff8b7a; --missing-soft: #3d1d19; --focus: #8fb1ff;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--font); font-weight: 400; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; line-height: 1.2; font-weight: 600; }
h2 { font-size: 1.02rem; font-weight: 600; }
h3 { font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: .85em; }
.eyebrow { font-size: .78rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: 10px 28px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-mark {
  display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff;
  box-shadow: inset 0 -4px 0 var(--pencil);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-name { font-weight: 600; line-height: 1.1; }
.brand-sy { font-size: .78rem; color: var(--muted); }
.topbar-files { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
.file-switch select {
  max-width: min(460px, 50vw); border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 7px 34px 7px 16px; font-weight: 500;
}
.topbar-actions { flex: none; display: flex; align-items: center; gap: 8px; }
.topbar .btn { padding: 7px 14px; }
.main { padding-block: 16px 40px; padding-inline: 24px; }
#view { display: flex; flex-direction: column; gap: 12px; max-width: 1280px; margin: 0 auto; }
.foot { max-width: 1240px; margin: 28px auto 0; text-align: center; }
@media (max-width: 980px) {
  .topbar { padding: 8px 16px; flex-wrap: wrap; }
  .brand-name, .brand-sy { display: none; }
  .topbar-files { order: 3; flex-basis: 100%; justify-content: stretch; }
  .file-switch, .file-switch select { width: 100%; max-width: none; }
  .main { padding-inline: 16px; padding-block: 18px 40px; }
}

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
.card.flush { padding: 0; gap: 0; overflow: hidden; }
.card.flush .card-head { padding: 10px 16px 8px; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.card.note { border-left: 4px solid var(--pencil); }
.card.note p { max-width: 75ch; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel.flush { padding: 0; overflow: hidden; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.head p { max-width: 70ch; margin-top: 4px; color: var(--muted); }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: .84rem; color: var(--muted); }
label.field > span { font-weight: 500; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 8px 10px; color: var(--ink); min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.big { padding: 11px 20px; font-size: .98rem; }
.btn.quiet { border-color: transparent; background: none; color: var(--accent); padding-inline: 10px; }
.btn.danger { color: var(--missing); }
.btn.danger.armed { background: var(--missing); border-color: var(--missing); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 12px; font-size: .85rem; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 500;
  background: var(--surface-3); color: var(--muted); white-space: nowrap;
}
.chip.ok { color: var(--sure); background: var(--sure-soft); }
.chip.warn { color: var(--check); background: var(--check-soft); }
.chip.bad { color: var(--missing); background: var(--missing-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--sure); } .dot.warn { background: var(--check); } .dot.bad { background: var(--missing); }

.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between;
  background: var(--pencil-soft); border: 1px solid color-mix(in srgb, var(--pencil) 60%, transparent); border-radius: var(--r); padding: 12px 16px;
}
.notice { border-left: 4px solid var(--check); background: var(--surface); padding: 12px 16px; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.notice.bad { border-left-color: var(--missing); }
.notice.ok { border-left-color: var(--accent); }
.notice ul { margin: 6px 0 0; padding-left: 18px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.warn-line { font-size: .86rem; color: var(--check); background: var(--check-soft); border-radius: var(--r-sm); padding: 8px 14px; }
.warn-line summary { cursor: pointer; font-weight: 600; }
.warn-line ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); }

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--surface); padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow); max-width: min(560px, 92vw);
}

/* ---------- welcome ---------- */
.hero { padding: 24px 0 4px; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
.hero h1 { font-size: clamp(1.9rem, 3.4vw, 2.7rem); line-height: 1.12; font-weight: 600; }
.hero h1::after { content: ""; display: block; width: 72px; height: 6px; border-radius: 3px; background: var(--pencil); margin-top: 14px; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 62ch; font-weight: 300; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: step; }
.steps li {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 16px 62px; position: relative;
  display: flex; flex-direction: column; gap: 3px; box-shadow: var(--shadow-sm);
}
.steps li::before {
  counter-increment: step; content: counter(step); position: absolute; left: 18px; top: 16px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.steps li span { color: var(--muted); font-size: .9rem; font-weight: 300; }
.drop {
  position: relative; border: 2px dashed var(--line-strong); border-radius: var(--r); padding: 28px 22px; text-align: center; background: var(--surface);
  display: flex; flex-direction: column; gap: 6px; align-items: center; cursor: pointer; transition: border-color .15s, background-color .15s;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop.big { padding: 44px 22px; }
.drop.big b { font-size: 1.2rem; font-weight: 600; }
.drop-icon { width: 52px; height: 52px; color: var(--accent); }
.drop-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.samples { text-align: center; }

/* ---------- working screen ---------- */
.work-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.wh-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wh-title h1 { font-size: clamp(1.4rem, 2.4vw, 1.9rem); }
.wh-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* form tabs: pill-shaped, the chosen one filled and glowing */
.sheet-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 6px 8px; scrollbar-width: thin; }
.tab {
  flex: none; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--muted);
  font-weight: 500; font-size: .9rem; padding: 6px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.tab:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab[aria-selected="true"] {
  color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pencil) 70%, transparent), 0 0 18px 2px color-mix(in srgb, var(--accent) 55%, transparent);
}
.tab[aria-selected="true"]:hover { color: var(--accent-ink); background: var(--accent); }
/* one slim row: class, period, language … counts */
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 8px 12px; box-shadow: var(--shadow-sm);
}
.controls-grow { flex: 1 1 0; }
.pill-field { display: inline-flex; align-items: center; gap: 8px; }
.pill-field > span { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.pill-field select { border-radius: 999px; padding: 5px 30px 5px 12px; background: var(--surface-2); font-size: .92rem; }
.controls .seg button { padding: 4px 12px; font-size: .9rem; }
.kind-tag { font-size: .8rem; color: var(--muted); background: var(--surface-3); padding: 4px 12px; border-radius: 999px; }
.stat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sc {
  display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: .8rem; color: var(--muted);
  background: var(--surface-3); white-space: nowrap;
}
.sc b { font-size: .98rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.sc.i { background: var(--sure-soft); color: var(--sure); } .sc.i b { color: var(--sure); }
.sc.n { background: var(--check-soft); color: var(--check); } .sc.n b { color: var(--check); }
.sc.f { background: var(--missing-soft); color: var(--missing); } .sc.f b { color: var(--missing); }

/* form details folded into one line */
.card.details { padding: 0; gap: 0; }
.card.details > summary {
  display: flex; align-items: center; gap: 14px; padding: 10px 16px; cursor: pointer; list-style: none; min-width: 0;
}
.card.details > summary::-webkit-details-marker { display: none; }
.card.details > summary::before {
  content: ""; width: 8px; height: 8px; flex: none; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg); transition: transform .15s;
}
.card.details[open] > summary::before { transform: rotate(45deg); }
.card.details > summary h2 { font-size: .95rem; flex: none; }
.details-line { flex: 1 1 auto; min-width: 0; display: flex; gap: 14px; overflow: hidden; white-space: nowrap; font-size: .86rem; mask-image: linear-gradient(90deg, #000 85%, transparent); }
.details-line i { font-style: normal; color: var(--muted); margin-right: 3px; }
.card.details > .grid2, .card.details > p { padding: 0 16px; }
.card.details > .grid2 { padding-top: 2px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 12px; }
.card.details .grid2 input, .card.details .grid2 select { padding: 6px 9px; }
.card.details label.field { gap: 3px; font-size: .8rem; }
.card.details > p { padding-bottom: 14px; padding-top: 10px; }
.lang-tag { background: var(--accent-soft); color: var(--accent); padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem; }

.fb-more { position: relative; }
.fb-more > summary { list-style: none; }
.fb-more > summary::-webkit-details-marker { display: none; }
.fb-menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 300px; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
}
.fb-menu .btn { justify-content: flex-start; border-radius: var(--r-sm); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; }
.stat b { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .82rem; color: var(--muted); }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line-strong); }
.stat.i::before { background: var(--sure); } .stat.i b { color: var(--sure); }
.stat.n::before { background: var(--check); } .stat.n b { color: var(--check); }
.stat.f::before { background: var(--missing); } .stat.f b { color: var(--missing); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .92rem; }
table.grid th {
  text-align: left; font-size: .74rem; font-weight: 600; color: var(--muted); padding: 7px 8px; background: var(--surface-2);
  border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
table.grid td { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
table.grid td input[type="text"], table.grid td input[type="number"], table.grid td select { width: 100%; padding: 6px 8px; border-color: transparent; background: transparent; border-radius: 6px; }
table.grid td input:hover, table.grid td select:hover { border-color: var(--line-strong); background: var(--surface); }
table.grid td input:focus, table.grid td select:focus { background: var(--surface); }
table.grid tr.sep td { background: var(--surface-3); font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 7px 12px; }
table.grid td.idx { color: var(--muted); width: 40px; text-align: right; font-variant-numeric: tabular-nums; padding-right: 10px; }
table.grid td.center { text-align: center; }
table.grid.entry th { text-align: center; white-space: normal; vertical-align: bottom; min-width: 64px; line-height: 1.25; }
table.grid.entry th.grp { border-bottom: 1px solid var(--line); background: var(--surface-3); color: var(--ink); }
table.grid.entry td.namecell { min-width: 240px; }
table.grid.entry td.namecell input { font-weight: 500; }
table.grid.entry td.numcell { width: 86px; }
table.grid.entry td.numcell input { text-align: center; font-variant-numeric: tabular-nums; }
table.grid.entry td.auto { background: var(--surface-2); font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
table.grid.entry td.rm { width: 40px; }
table.grid.entry td.rm .btn { opacity: 0; }
table.grid.entry tr:hover td.rm .btn, table.grid.entry td.rm .btn:focus-visible { opacity: 1; }
table.grid.entry tr.addrow td { padding: 8px 10px; }
table.grid.entry .add-name { width: 100%; border: 1.5px dashed var(--line-strong) !important; background: var(--surface) !important; border-radius: var(--r-sm); padding: 9px 12px; }
table.grid.entry .add-name:focus { border-style: solid !important; border-color: var(--focus) !important; }
button.mark {
  width: 34px; height: 28px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer;
  color: #fff; font-size: .7rem; line-height: 1; transition: background-color .12s, border-color .12s;
}
button.mark:hover { border-color: var(--accent); }
button.mark[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
button.mark.lvl-Independent[aria-pressed="true"] { background: var(--sure); border-color: var(--sure); }
button.mark.lvl-Instructional[aria-pressed="true"] { background: var(--check); border-color: var(--check); }
button.mark.lvl-Frustration[aria-pressed="true"] { background: var(--missing); border-color: var(--missing); }
table.grid.sum th, table.grid.sum td { text-align: center; }
table.grid.sum tbody th { text-align: left; background: none; position: static; color: var(--ink); font-size: .9rem; font-weight: 500; }
table.grid.sum td { padding: 10px 8px; font-variant-numeric: tabular-nums; }
table.grid.sum td.strong { font-weight: 600; }
td.lv-i { color: var(--sure); font-weight: 600; } td.lv-n { color: var(--check); font-weight: 600; } td.lv-f { color: var(--missing); font-weight: 600; }
.w-lrn { width: 150px; } .w-sex { width: 74px; } .w-grade { width: 118px; }

/* ---------- adjust (field mapping) ---------- */
.mapper { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .mapper { grid-template-columns: 1fr; } }
.sheet-view { background: #e9ecf1; border: 1px solid var(--line); border-radius: var(--r); overflow: auto; max-height: 78vh; padding: 16px; }
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 70px; max-height: 86vh; overflow: auto; }
.side .panel { padding: 12px; }
.map-list { display: flex; flex-direction: column; gap: 2px; font-size: .88rem; }
.map-item { display: grid; grid-template-columns: auto 46px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px; border-radius: 6px; }
.map-item:hover { background: var(--surface-2); }
.map-item .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 4px; }
.map-item select { font-size: .85rem; padding: 4px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- drawn Excel sheet (used by Adjust) ---------- */
.paper { background: #fff; color: #000; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); display: inline-block; padding: 12px; }
.xl-wrapper { position: relative; color: #000; background: #fff; }
table.xl-sheet { border-collapse: collapse; table-layout: fixed; font-family: Calibri, Carlito, Arial, sans-serif; font-size: 14.7px; color: #000; }
table.xl-sheet td { padding: 0 2px; overflow: hidden; white-space: nowrap; line-height: 1.15; position: relative; }
table.xl-sheet .xl-c { overflow: hidden; text-overflow: clip; }
table.xl-sheet td[style*="overflow:visible"] > .xl-c { overflow: visible; }
table.xl-sheet .xl-wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
table.xl-sheet tr.xl-hidden { display: none; }
.xl-img { position: absolute; pointer-events: none; }
.sheet-view table.xl-sheet td { cursor: pointer; }
.sheet-view table.xl-sheet td:hover { outline: 1px solid #2552b8; outline-offset: -1px; }
td.mk-sure { box-shadow: inset 0 0 0 999px rgba(29, 135, 86, .22); outline: 2px solid #1d8756; outline-offset: -2px; }
td.mk-check { box-shadow: inset 0 0 0 999px rgba(214, 150, 30, .28); outline: 2px solid #c6861b; outline-offset: -2px; }
td.mk-col { box-shadow: inset 0 0 0 999px rgba(29, 135, 86, .10); }
td.mk-colcheck { box-shadow: inset 0 0 0 999px rgba(214, 150, 30, .16); }
td.mk-head { box-shadow: inset 0 0 0 999px rgba(37, 82, 184, .10); }
td.mk-sel { outline: 3px solid #2552b8 !important; outline-offset: -3px; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .tab, .seg button { transition: background-color .15s, border-color .15s, color .15s, box-shadow .2s; }
}

</style>

<script>
/* Reading, rendering and filling .xlsx templates.
 *
 * The filler never rebuilds the workbook. It edits only the <c> elements it
 * writes to, inside the sheet XML parts it touches, so logos, borders, merged
 * cells, print settings and formulas in the DepEd file stay exactly as they
 * were.
 */
(function (global) {
  'use strict';

  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_XDR = 'http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing';
  const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const NS_PKG = 'http://schemas.openxmlformats.org/package/2006/relationships';

  const INDEXED = ('000000,FFFFFF,FF0000,00FF00,0000FF,FFFF00,FF00FF,00FFFF,000000,FFFFFF,FF0000,00FF00,0000FF,FFFF00,FF00FF,00FFFF,' +
    '800000,008000,000080,808000,800080,008080,C0C0C0,808080,9999FF,993366,FFFFCC,CCFFFF,660066,FF8080,0066CC,CCCCFF,' +
    '000080,FF00FF,FFFF00,00FFFF,800080,800000,008080,0000FF,00CCFF,CCFFFF,CCFFCC,FFFF99,99CCFF,FF99CC,CC99FF,FFCC99,' +
    '3366FF,33CCCC,99CC00,FFCC00,FF9900,FF6600,666699,969696,003366,339966,003300,333300,993300,993366,333399,333333').split(',');

  // ---------- cell references ----------
  function colToNum(s) { let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function numToCol(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function parseRef(ref) { const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(ref); return m ? { c: colToNum(m[1]), r: +m[2] } : null; }
  function makeRef(r, c) { return numToCol(c) + r; }
  function parseRange(rng) { const [a, b] = rng.split(':'); const s = parseRef(a); const e = b ? parseRef(b) : s; return { r1: s.r, c1: s.c, r2: e.r, c2: e.c }; }

  const els = (node, name) => node ? Array.from(node.getElementsByTagNameNS(NS, name)) : [];
  const el = (node, name) => els(node, name)[0] || null;
  const kids = (node, name) => node ? Array.from(node.children).filter(n => n.localName === name) : [];
  const kid = (node, name) => kids(node, name)[0] || null;

    if (doc.getElementsByTagName('parsererror').length) throw new Error('This file has damaged XML inside.');
    return doc;
  }

  function resolvePath(base, target) {

    }

  }

    return partPath.slice(0, i) + '/_rels/' + partPath.slice(i + 1) + '.rels';
  }

    const f = zip.file(relsPathFor(partPath));
    const map = {};

    const doc = parseXml(await f.async('string'));
    for (const r of Array.from(doc.getElementsByTagNameNS(NS_PKG, 'Relationship'))) {

    }

  }

    return [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function readColor(node, theme) {
    if (!node) return null;
    let hex = null;
    if (node.getAttribute('rgb')) hex = node.getAttribute('rgb').slice(-6);
    else if (node.getAttribute('theme') != null) hex = theme[+node.getAttribute('theme')] || null;
    else if (node.getAttribute('indexed') != null) {
      const i = +node.getAttribute('indexed');
      if (i === 64) return null;
      hex = INDEXED[i] || null;
    }
    if (!hex) return null;
    return '#' + tintHex(hex, parseFloat(node.getAttribute('tint') || '0'));
  }

  async function readTheme(zip) {
    const f = zip.file('xl/theme/theme1.xml');
    const fallback = ['FFFFFF', '000000', 'E7E6E6', '44546A', '4472C4', 'ED7D31', 'A5A5A5', 'FFC000', '5B9BD5', '70AD47'];
    if (!f) return fallback;
    const doc = parseXml(await f.async('string'));
    const scheme = doc.getElementsByTagNameNS(NS_A, 'clrScheme')[0];
    if (!scheme) return fallback;
    const get = name => {
      const n = scheme.getElementsByTagNameNS(NS_A, name)[0];
      if (!n) return null;
      const c = n.firstElementChild;
      if (!c) return null;
      return (c.getAttribute('lastClr') || c.getAttribute('val') || '').slice(-6) || null;
    };
    // theme index order used by cell colours: lt1, dk1, lt2, dk2, accent1..6
    return ['lt1', 'dk1', 'lt2', 'dk2', 'accent1', 'accent2', 'accent3', 'accent4', 'accent5', 'accent6'].map((n, i) => get(n) || fallback[i]);
  }

  async function readStyles(zip, theme) {
    const out = { xfs: [], numFmts: {} };
    const f = zip.file('xl/styles.xml');
    if (!f) return out;
    const doc = parseXml(await f.async('string'));
    for (const n of els(doc, 'numFmt')) out.numFmts[n.getAttribute('numFmtId')] = n.getAttribute('formatCode');
    const fonts = els(el(doc, 'fonts'), 'font').map(fn => {
      const val = (name, attr = 'val') => { const k = kid(fn, name); return k ? (k.getAttribute(attr) ?? '1') : null; };
      const b = kid(fn, 'b'), i = kid(fn, 'i'), u = kid(fn, 'u'), strike = kid(fn, 'strike');
      const on = k => k && k.getAttribute('val') !== '0' && k.getAttribute('val') !== 'false';
      return {
        name: val('name'), size: parseFloat(val('sz') || '11'),
        bold: on(b), italic: on(i), underline: on(u), strike: on(strike),
        color: readColor(kid(fn, 'color'), theme),
      };
    });
    const fills = els(el(doc, 'fills'), 'fill').map(fl => {
      const p = kid(fl, 'patternFill');
      if (!p || !p.getAttribute('patternType') || p.getAttribute('patternType') === 'none') return null;
      return readColor(kid(p, 'fgColor'), theme) || readColor(kid(p, 'bgColor'), theme);
    });
    const borders = els(el(doc, 'borders'), 'border').map(bd => {
      const side = name => {
        const s = kid(bd, name);
        if (!s || !s.getAttribute('style')) return null;
        return { style: s.getAttribute('style'), color: readColor(kid(s, 'color'), theme) || '#000000' };
      };
      return { left: side('left') || side('start'), right: side('right') || side('end'), top: side('top'), bottom: side('bottom') };
    });
    const cellXfs = el(doc, 'cellXfs');
    out.xfs = kids(cellXfs, 'xf').map(x => {
      const al = kid(x, 'alignment');
      return {
        font: fonts[+(x.getAttribute('fontId') || 0)] || null,
        fill: fills[+(x.getAttribute('fillId') || 0)] || null,
        border: borders[+(x.getAttribute('borderId') || 0)] || null,
        numFmtId: x.getAttribute('numFmtId') || '0',
        h: al ? al.getAttribute('horizontal') : null,
        v: al ? al.getAttribute('vertical') : null,
        wrap: al ? al.getAttribute('wrapText') === '1' || al.getAttribute('wrapText') === 'true' : false,
        rotate: al ? +(al.getAttribute('textRotation') || 0) : 0,
        indent: al ? +(al.getAttribute('indent') || 0) : 0,
      };
    });
    out.defaultFont = fonts[0] || null;
    return out;
  }

  function stringItemText(si) {
    // all <t> that are not inside phonetic runs
    let s = '';
    for (const t of Array.from(si.getElementsByTagNameNS(NS, 't'))) {
      if (t.parentNode && t.parentNode.localName === 'rPh') continue;
      s += t.textContent;
    }
    return s;
  }

  async function readSharedStrings(zip) {
    const f = zip.file('xl/sharedStrings.xml');
    if (!f) return [];
    const doc = parseXml(await f.async('string'));
    return kids(doc.documentElement, 'si').map(stringItemText);
  }

  // ---------- number display ----------
  function formatNumber(v, fmtCode, fmtId) {
    const id = +fmtId;
    const code = fmtCode || '';
    if ((id >= 14 && id <= 22) || (/[dmy]/i.test(code) && !/[0#]/.test(code.replace(/\[.*?\]/g, '')))) {
      const d = new Date(Math.round((v - 25569) * 86400000));
      if (!isNaN(d)) return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
    }
    if (id === 9 || id === 10 || code.includes('%')) {
      const dec = id === 10 ? 2 : ((code.split('.')[1] || '').replace(/[^0]/g, '').length);
      return (v * 100).toFixed(dec) + '%';
    }
    if (id === 2 || id === 4 || /0\.0+/.test(code)) {
      const dec = id === 2 || id === 4 ? 2 : (code.split('.')[1] || '').replace(/[^0]/g, '').length;
      return v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1e6) / 1e6);
  }

  // move the relative references of a shared formula to another cell
  function shiftFormula(text, dr, dc) {
    return text.split('"').map((part, i) => i % 2 ? part : part.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)(?![\w(])/g, (m, cAbs, col, rAbs, row) =>
      (cAbs ? '$' + col : numToCol(colToNum(col) + dc)) + (rAbs ? '$' + row : String(+row + dr)))).join('"');
  }

  // ---------- workbook loading ----------
  async function loadWorkbook(buffer) {
    const zip = await global.JSZip.loadAsync(buffer);
    const wbFile = zip.file('xl/workbook.xml');
    if (!wbFile) throw new Error('This is not an Excel .xlsx workbook. If it is an old .xls file, open it in Excel and use File > Save As > Excel Workbook (.xlsx).');
    const wbDoc = parseXml(await wbFile.async('string'));
    const rels = await readRels(zip, 'xl/workbook.xml');
    const theme = await readTheme(zip);
    const styles = await readStyles(zip, theme);
    const sst = await readSharedStrings(zip);
    const printAreas = {};
    for (const dn of els(wbDoc, 'definedName')) {
      if (dn.getAttribute('name') === '_xlnm.Print_Area' && dn.getAttribute('localSheetId') != null) {
        const txt = dn.textContent.split(',')[0];
        const m = /!\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)/.exec(txt);
        if (m) printAreas[+dn.getAttribute('localSheetId')] = { r1: +m[2], c1: colToNum(m[1]), r2: +m[4], c2: colToNum(m[3]) };
      }
    }
    const sheetEls = els(wbDoc, 'sheet');
    const sheets = [];
    for (let i = 0; i < sheetEls.length; i++) {
      const s = sheetEls[i];
      const rid = s.getAttributeNS(NS_R, 'id') || s.getAttribute('r:id');
      const rel = rels[rid];
      if (!rel || !/worksheet$/.test(rel.type)) continue;
      const sheet = await readSheet(zip, rel.target, styles, sst);
      sheet.mdw = maxDigitWidth(styles.defaultFont);
      if (sheet.defaultColWidth == null) sheet.defaultColWidth = (sheet.baseColWidth || 8) + 5 / sheet.mdw;
      sheet.name = s.getAttribute('name');
      sheet.index = i;
      sheet.hidden = !!s.getAttribute('state') && s.getAttribute('state') !== 'visible';
      sheet.printArea = printAreas[i] || null;
      sheets.push(sheet);
    }
    return { zip, sheets, styles };
  }

  async function readSheet(zip, path, styles, sst) {
    const doc = parseXml(await zip.file(path).async('string'));
    const cells = new Map();
    const rowsInfo = {};
    const colsInfo = [];
    const fmtPr = el(doc, 'sheetFormatPr');
    const baseColWidth = fmtPr && fmtPr.getAttribute('baseColWidth') ? parseFloat(fmtPr.getAttribute('baseColWidth')) : 8;
    const defaultColWidth = fmtPr && fmtPr.getAttribute('defaultColWidth') ? parseFloat(fmtPr.getAttribute('defaultColWidth')) : null;
    const defaultRowHeight = fmtPr && fmtPr.getAttribute('defaultRowHeight') ? parseFloat(fmtPr.getAttribute('defaultRowHeight')) : 15;
    for (const c of els(el(doc, 'cols'), 'col')) {
      colsInfo.push({
        min: +c.getAttribute('min'), max: +c.getAttribute('max'),
        width: c.getAttribute('width') ? parseFloat(c.getAttribute('width')) : null,
        hidden: c.getAttribute('hidden') === '1', style: c.getAttribute('style'),
      });
    }
    let maxR = 0, maxC = 0;
    const shared = {};
    for (const row of els(el(doc, 'sheetData'), 'row')) {
      const r = +row.getAttribute('r');
      rowsInfo[r] = {
        ht: row.getAttribute('ht') ? parseFloat(row.getAttribute('ht')) : null,
        hidden: row.getAttribute('hidden') === '1',
        s: row.getAttribute('customFormat') === '1' ? row.getAttribute('s') : null,
      };
      for (const c of kids(row, 'c')) {
        const ref = c.getAttribute('r');
        const p = parseRef(ref);
        if (!p) continue;
        const t = c.getAttribute('t');
        const s = +(c.getAttribute('s') || 0);
        const f = kid(c, 'f');
        const v = kid(c, 'v');
        let value = null, type = 'blank';
        if (t === 's' && v) { value = sst[+v.textContent] ?? ''; type = 'string'; }
        else if (t === 'inlineStr') { const is = kid(c, 'is'); value = is ? stringItemText(is) : ''; type = 'string'; }
        else if (t === 'str') { value = v ? v.textContent : ''; type = 'string'; }
        else if (t === 'b') { value = v && v.textContent === '1' ? 'TRUE' : 'FALSE'; type = 'bool'; }
        else if (t === 'e') { value = v ? v.textContent : '#ERR'; type = 'error'; }
        else if (v && v.textContent !== '') { value = parseFloat(v.textContent); type = 'number'; }
        let formula = null;
        if (f) {
          formula = f.textContent || '(shared)';
          if (f.getAttribute('t') === 'shared' && f.getAttribute('si') != null) {
            const si = f.getAttribute('si');
            if (f.textContent) shared[si] = { text: f.textContent, r: p.r, c: p.c };
            else if (shared[si]) formula = shiftFormula(shared[si].text, p.r - shared[si].r, p.c - shared[si].c);
          }
        }
        cells.set(ref, { r: p.r, c: p.c, ref, s, value, type, formula });
        if (p.r > maxR) maxR = p.r;
        if (p.c > maxC) maxC = p.c;
      }
    }
    const merges = els(el(doc, 'mergeCells'), 'mergeCell').map(m => parseRange(m.getAttribute('ref')));
    for (const m of merges) { if (m.r2 > maxR) maxR = m.r2; if (m.c2 > maxC) maxC = m.c2; }

    const ps = el(doc, 'pageSetup');
    const pm = el(doc, 'pageMargins');
    const po = el(doc, 'printOptions');
    const spr = el(doc, 'pageSetUpPr');
    const brk = name => els(el(doc, name), 'brk').map(b => +b.getAttribute('id')).filter(n => n > 0);
    const num = (node, a, d) => node && node.getAttribute(a) != null && node.getAttribute(a) !== '' ? parseFloat(node.getAttribute(a)) : d;
    const page = {
      orientation: ps ? ps.getAttribute('orientation') || 'portrait' : 'portrait',
      paperSize: ps ? +(ps.getAttribute('paperSize') || 9) : 9,
      scale: num(ps, 'scale', 100),
      fitToPage: !!spr && (spr.getAttribute('fitToPage') === '1' || spr.getAttribute('fitToPage') === 'true'),
      fitToWidth: num(ps, 'fitToWidth', 1),
      fitToHeight: num(ps, 'fitToHeight', 1),
      margins: { left: num(pm, 'left', 0.7), right: num(pm, 'right', 0.7), top: num(pm, 'top', 0.75), bottom: num(pm, 'bottom', 0.75) },
      hCenter: !!po && po.getAttribute('horizontalCentered') === '1',
      vCenter: !!po && po.getAttribute('verticalCentered') === '1',
      // the template maker chose print settings (paper, scale, fit, orientation)
      hasSetup: !!(ps && ['paperSize', 'scale', 'fitToWidth', 'fitToHeight', 'orientation'].some(a => ps.getAttribute(a) != null)) || !!spr,
      rowBreaks: brk('rowBreaks'),
      colBreaks: brk('colBreaks'),
    };

    // pictures (logos) from the sheet's drawing part
    const images = [];
    const sheetRels = await readRels(zip, path);
    const drawingEl = el(doc, 'drawing');
    if (drawingEl) {
      const rel = sheetRels[drawingEl.getAttributeNS(NS_R, 'id')];
      if (rel && zip.file(rel.target)) {
        try {
          const ddoc = parseXml(await zip.file(rel.target).async('string'));
          const drels = await readRels(zip, rel.target);
          const anchors = [
            ...Array.from(ddoc.getElementsByTagNameNS(NS_XDR, 'twoCellAnchor')),
            ...Array.from(ddoc.getElementsByTagNameNS(NS_XDR, 'oneCellAnchor')),
          ];
          for (const a of anchors) {
            const cnv = a.getElementsByTagNameNS(NS_XDR, 'cNvPr')[0];
            if (cnv && (cnv.getAttribute('hidden') === '1' || cnv.getAttribute('hidden') === 'true')) continue;
            const cd = a.getElementsByTagNameNS(NS_XDR, 'clientData')[0];
            if (cd && (cd.getAttribute('fPrintsWithSheet') === '0' || cd.getAttribute('fPrintsWithSheet') === 'false')) continue;
            const blip = a.getElementsByTagNameNS(NS_A, 'blip')[0];
            if (!blip) continue;
            const target = drels[blip.getAttributeNS(NS_R, 'embed')];
            if (!target || !zip.file(target.target)) continue;
            const pos = n => n ? {
              col: +n.getElementsByTagNameNS(NS_XDR, 'col')[0].textContent,
              colOff: +n.getElementsByTagNameNS(NS_XDR, 'colOff')[0].textContent,
              row: +n.getElementsByTagNameNS(NS_XDR, 'row')[0].textContent,
              rowOff: +n.getElementsByTagNameNS(NS_XDR, 'rowOff')[0].textContent,
            } : null;
            const from = pos(a.getElementsByTagNameNS(NS_XDR, 'from')[0]);
            const to = pos(a.getElementsByTagNameNS(NS_XDR, 'to')[0]);
            const extEl = a.getElementsByTagNameNS(NS_A, 'ext');
            let ext = null;
            for (const e of Array.from(extEl)) if (e.getAttribute('cx')) { ext = { cx: +e.getAttribute('cx'), cy: +e.getAttribute('cy') }; break; }
            const xdrExt = a.getElementsByTagNameNS(NS_XDR, 'ext')[0];
            if (xdrExt) ext = { cx: +xdrExt.getAttribute('cx'), cy: +xdrExt.getAttribute('cy') };
            const bytes = await zip.file(target.target).async('base64');
            const extName = target.target.split('.').pop().toLowerCase();
            const mime = extName === 'jpg' || extName === 'jpeg' ? 'image/jpeg' : extName === 'gif' ? 'image/gif' : extName === 'emf' || extName === 'wmf' ? null : 'image/png';
            if (!mime) continue;
            images.push({ from, to, ext, src: `data:${mime};base64,${bytes}` });
            if (to && to.row + 1 > maxR) maxR = to.row + 1;
          }
        } catch (e) { /* a drawing we cannot read is skipped in the preview only */ }
      }
    }

    return {
      path, cells, merges, rowsInfo, colsInfo, defaultColWidth, baseColWidth, defaultRowHeight,
      maxR, maxC, page, images, styles,
    };
  }

  // ---------- sheet helpers ----------
  function mergeAt(sheet, r, c) {
    for (const m of sheet.merges) if (r >= m.r1 && r <= m.r2 && c >= m.c1 && c <= m.c2) return m;
    return null;
  }
  function cellText(sheet, r, c) {
    const cell = sheet.cells.get(makeRef(r, c));
    if (!cell || cell.value == null) return '';
    return typeof cell.value === 'number' ? formatNumber(cell.value, sheet.styles.numFmts[sheet.styles.xfs[cell.s]?.numFmtId], sheet.styles.xfs[cell.s]?.numFmtId) : String(cell.value);
  }
  function colWidthChars(sheet, c) {
    for (const ci of sheet.colsInfo) if (c >= ci.min && c <= ci.max) return ci.hidden ? 0 : (ci.width ?? sheet.defaultColWidth);
    return sheet.defaultColWidth;
  }
  // Excel measures column widths in digits of the workbook's normal font
  const colPx = (sheet, c) => {
    const w = colWidthChars(sheet, c);
    if (w === 0) return 0;
    const mdw = sheet.mdw || 7;
    return Math.floor(((256 * w + Math.floor(128 / mdw)) / 256) * mdw);
  };
  const mdwCache = {};
  function maxDigitWidth(font) {
    if (!font || typeof document === 'undefined') return 7;
    const px = Math.round((font.size || 11) * 96 / 72);
    const key = font.name + '|' + px;
    if (mdwCache[key]) return mdwCache[key];
    let w = 7;
    try {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = `${px}px '${(font.name || 'Calibri').replace(/'/g, '')}', Calibri, Carlito, Arial, sans-serif`;
      w = Math.max(...'0123456789'.split('').map(d => ctx.measureText(d).width));
      w = Math.round(w) || 7;
    } catch (e) { /* keep 7 */ }
    return (mdwCache[key] = w);
  }
  function rowPx(sheet, r) {
    const ri = sheet.rowsInfo[r];
    if (ri && ri.hidden) return 0;
    let pt = ri && ri.ht != null ? ri.ht : null;
    if (pt == null) {
      // Excel fits the row to its largest font
      sheet._autoRow = sheet._autoRow || {};
      if (sheet._autoRow[r] == null) {
        let maxSize = 0;
        for (let c = 1; c <= Math.min(sheet.maxC, 100); c++) {
          const cell = sheet.cells.get(makeRef(r, c));
          if (!cell || cell.value == null || cell.value === '') continue;
          const f = sheet.styles.xfs[cell.s] && sheet.styles.xfs[cell.s].font;
          if (f && f.size > maxSize) maxSize = f.size;
        }
        sheet._autoRow[r] = Math.max(sheet.defaultRowHeight, maxSize ? Math.ceil(maxSize * 1.36) : 0);
      }
      pt = sheet._autoRow[r];
    }
    return Math.round(pt * 4 / 3);
  }
  function styleOf(sheet, r, c) {
    const cell = sheet.cells.get(makeRef(r, c));
    if (cell) return sheet.styles.xfs[cell.s] || null;
    const ri = sheet.rowsInfo[r];
    if (ri && ri.s != null) return sheet.styles.xfs[+ri.s] || null;
    for (const ci of sheet.colsInfo) if (c >= ci.min && c <= ci.max && ci.style != null) return sheet.styles.xfs[+ci.style] || null;
    return null;
  }
  function hasBorder(sheet, r, c, side) {
    const st = styleOf(sheet, r, c);
    if (st && st.border && st.border[side]) return true;
    // neighbours may draw the shared edge
    if (side === 'bottom') { const s2 = styleOf(sheet, r + 1, c); return !!(s2 && s2.border && s2.border.top); }
    if (side === 'top' && r > 1) { const s2 = styleOf(sheet, r - 1, c); return !!(s2 && s2.border && s2.border.bottom); }
    return false;
  }

  // ---------- rendering ----------
  const BORDER_CSS = {
    thin: '1px solid', hair: '1px dotted', dotted: '1px dotted', dashed: '1px dashed', medium: '2px solid',
    mediumDashed: '2px dashed', thick: '3px solid', double: '3px double', dashDot: '1px dashed', mediumDashDot: '2px dashed',
    dashDotDot: '1px dashed', slantDashDot: '2px dashed', mediumDashDotDot: '2px dashed',
  };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  /* Render a sheet as an HTML table that follows the workbook's widths,
   * heights, merges, fonts, fills, borders and pictures.
   * opts.marks: {ref: className} to highlight cells (mapping view)
   * opts.values: {ref: text} to show pending values without saving
   * opts.editable: let the user type into every cell that is not a formula
   * opts.locked: Set of refs that stay read-only (worked out by the app)
   * opts.toggles: Set of refs that switch on/off with a click (tick columns)
   */
  /* What Excel prints when no print area is set: the cells that show
   * something (a value, a border, a fill), merged boxes and pictures.
   * Cells that only carry a font or number format are ignored. */
  function printArea(sheet) {
    if (sheet.printArea) return sheet.printArea;
    if (sheet._area) return sheet._area;
    let r2 = 1, c2 = 1;
    const visible = (st) => st && (st.fill || (st.border && (st.border.left || st.border.right || st.border.top || st.border.bottom)));
    for (const cell of sheet.cells.values()) {
      const shows = (cell.value != null && cell.value !== '') || cell.formula || visible(sheet.styles.xfs[cell.s]);
      if (!shows) continue;
      if (cell.r > r2) r2 = cell.r;
      if (cell.c > c2) c2 = cell.c;
    }
    for (const m of sheet.merges) {
      const tl = sheet.cells.get(makeRef(m.r1, m.c1));
      if (!tl || (tl.value == null && !visible(sheet.styles.xfs[tl.s]))) continue;
      if (m.r2 > r2) r2 = m.r2;
      if (m.c2 > c2) c2 = m.c2;
    }
    for (const im of sheet.images) {
      const to = im.to || im.from;
      if (to) { if (to.row + 1 > r2) r2 = to.row + 1; if (to.col + 1 > c2) c2 = to.col + 1; }
    }
    return (sheet._area = { r1: 1, c1: 1, r2, c2 });
  }

  /* opts.range: {r1,c1,r2,c2} draws only that part (one printed page) */
  function renderSheet(sheet, opts = {}) {
    const area = opts.range || Object.assign({}, opts.full ? { r2: sheet.maxR, c2: sheet.maxC } : printArea(sheet), { r1: 1, c1: 1 });
    const r1 = area.r1, c1 = area.c1;
    const r2 = Math.min(area.r2, r1 + 600), c2 = Math.min(area.c2, c1 + 100);
    const marks = opts.marks || {};
    const colW = [];
    let totalW = 0, colgroup = '';
    for (let c = c1; c <= c2; c++) { const w = colPx(sheet, c); colW[c] = w; totalW += w; colgroup += `<col style="width:${w}px">`; }
    let html = `<table class="xl-sheet" cellspacing="0" cellpadding="0" style="width:${totalW}px"><colgroup>${colgroup}</colgroup><tbody>`;
    // merges clipped to the drawn range; a merge cut by a page break continues as an empty box
    const starts = new Map();
    const covered = new Set();
    for (const m of sheet.merges) {
      const mr1 = Math.max(m.r1, r1), mc1 = Math.max(m.c1, c1), mr2 = Math.min(m.r2, r2), mc2 = Math.min(m.c2, c2);
      if (mr1 > mr2 || mc1 > mc2) continue;
      starts.set(mr1 + ':' + mc1, { m, mr1, mc1, mr2, mc2, cont: mr1 !== m.r1 || mc1 !== m.c1 });
      for (let r = mr1; r <= mr2; r++) for (let c = mc1; c <= mc2; c++) if (r !== mr1 || c !== mc1) covered.add(r + ':' + c);
    }
    let totalH = 0;
    for (let r = r1; r <= r2; r++) {
      const h = rowPx(sheet, r);
      totalH += h;
      html += `<tr style="height:${h}px"${h === 0 ? ' class="xl-hidden"' : ''}>`;
      for (let c = c1; c <= c2; c++) {
        if (covered.has(r + ':' + c)) continue;
        const ref = makeRef(r, c);
        const mm = starts.get(r + ':' + c);
        const m = mm ? mm.m : null;
        const rs = mm ? mm.mr2 - r + 1 : 1;
        const cs = mm ? mm.mc2 - c + 1 : 1;
        const cont = mm && mm.cont;
        const st = cont ? styleOf(sheet, m.r1, m.c1) : styleOf(sheet, r, c);
        const css = [];
        const cell = cont ? null : sheet.cells.get(ref);
        const txt = cont ? '' : (opts.values && ref in opts.values ? opts.values[ref] : cellText(sheet, r, c));
        if (st) {
          const f = st.font;
          if (f) {
            if (f.bold) css.push('font-weight:700');
            if (f.italic) css.push('font-style:italic');
            if (f.underline || f.strike) css.push(`text-decoration:${f.underline ? 'underline' : ''} ${f.strike ? 'line-through' : ''}`);
            css.push(`font-size:${(f.size * 4 / 3).toFixed(1)}px`);
            if (f.name) css.push(`font-family:'${f.name.replace(/["'<>&]/g, '')}',Calibri,Carlito,Arial,sans-serif`);
            if (f.color) css.push(`color:${f.color}`);
          }
          if (st.fill) css.push(`background:${st.fill}`);
          const b = st.border || {};
          // for merged cells, the right/bottom edge comes from the far cells
          const right = m ? (styleOf(sheet, m.r1, m.c2)?.border?.right) : b.right;
          const bottom = m ? (styleOf(sheet, m.r2, m.c1)?.border?.bottom) : b.bottom;
          const sides = { left: b.left, top: b.top, right, bottom };
          for (const k in sides) if (sides[k]) css.push(`border-${k}:${BORDER_CSS[sides[k].style] || '1px solid'} ${sides[k].color}`);
          const h = st.h || (cell && cell.type === 'number' ? 'right' : null);
          if (h && h !== 'general') css.push(`text-align:${h === 'centerContinuous' ? 'center' : h === 'justify' || h === 'distributed' ? 'justify' : h}`);
          css.push(`vertical-align:${st.v === 'center' ? 'middle' : st.v === 'top' ? 'top' : 'bottom'}`);
          if (st.wrap) css.push('white-space:pre-wrap');
          if (st.indent) css.push(`padding-left:${st.indent * 9 + 2}px`);
        } else {
          css.push('vertical-align:bottom');
          if (cell && cell.type === 'number') css.push('text-align:right');
        }
        // like Excel, text runs over into empty cells on its right
        const hAlign = st && st.h;
        if (!mm && txt && !(st && st.wrap) && (!hAlign || hAlign === 'left' || hAlign === 'general') && !(cell && cell.type === 'number')) {
          const nextEmpty = c < c2 && !sheet.cells.get(makeRef(r, c + 1))?.value && !(opts.values && opts.values[makeRef(r, c + 1)]) && !mergeAt(sheet, r, c + 1);
          if (nextEmpty) css.push('overflow:visible;position:relative;z-index:1');
        }
        const cls = marks[ref] ? ` class="${marks[ref]}"` : '';
        const tip = opts.titles && opts.titles[ref] ? ` title="${esc(opts.titles[ref])}"` : '';
        const vert = st && st.rotate === 255 ? ' xl-vert' : '';
        const locked = opts.locked && opts.locked.has(ref);
        const toggle = opts.toggles && opts.toggles.has(ref);
        const editable = opts.editable && !cont && !(cell && cell.formula) && !locked && !toggle;
        const inner = toggle ? ' tabindex="0" role="checkbox"' : editable ? ' contenteditable="true" spellcheck="false"' : '';
        html += `<td${cont ? '' : ` data-ref="${ref}"`}${rs > 1 ? ` rowspan="${rs}"` : ''}${cs > 1 ? ` colspan="${cs}"` : ''}${cls}${tip} style="${css.join(';')}"><div class="xl-c${st && st.wrap ? ' xl-wrap' : ''}${vert}${toggle ? ' xl-toggle' : ''}"${inner}>${esc(txt)}</div></td>`;
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    // pictures, placed from the sheet origin and shifted to this range
    const colLeft = c => { let x = 0; for (let i = 1; i < c; i++) x += colPx(sheet, i); return x; };
    const rowTop = r => { let y = 0; for (let i = 1; i < r; i++) y += rowPx(sheet, i); return y; };
    const ox = colLeft(c1), oy = rowTop(r1);
    let imgs = '';
    for (const im of sheet.images) {
      if (!im.from) continue;
      const left = colLeft(im.from.col + 1) + im.from.colOff / 9525 - ox;
      const top = rowTop(im.from.row + 1) + im.from.rowOff / 9525 - oy;
      let w, h;
      if (im.to) {
        w = colLeft(im.to.col + 1) + im.to.colOff / 9525 - ox - left;
        h = rowTop(im.to.row + 1) + im.to.rowOff / 9525 - oy - top;
      }
      if ((!w || !h) && im.ext) { w = im.ext.cx / 9525; h = im.ext.cy / 9525; }
      if (left + w < 0 || top + h < 0 || left > totalW || top > totalH) continue;
      imgs += `<img class="xl-img" alt="" src="${im.src}" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">`;
    }
    return `<div class="xl-wrapper" style="width:${totalW}px;height:${totalH}px">${html}${imgs}</div>`;
  }

  // ---------- printed pages ----------
  // paper sizes in inches (Excel paperSize codes)
  const PAPER_IN = { 1: [8.5, 11], 5: [8.5, 14], 8: [11.69, 16.54], 9: [8.27, 11.69], 11: [5.83, 8.27], 14: [8.5, 13] };

  /* Work out the pages exactly as the saved file prints them.
   * override = the Page setup chosen in the app: {fit, orientation, paper}
   */
  function paginate(sheet, override = {}) {
    const pg = Object.assign({}, sheet.page);
    if (override.orientation) pg.orientation = override.orientation;
    if (override.paper) pg.paperSize = override.paper;
    // fit 'page': whole form on one page; 'width': shrink only a form that is too wide
    if (override.margins) pg.margins = override.margins;
    if (override.hCenter) pg.hCenter = true;
    if (override.noBreaks) { pg.rowBreaks = []; pg.colBreaks = []; }
    if (override.auto) pg.scale = 100;
    if (override.fit === 'page') { pg.fitToPage = true; pg.fitToWidth = 1; pg.fitToHeight = 1; }
    else if (override.fit && (override.auto || needsFit(sheet, pg))) { pg.fitToPage = true; pg.fitToWidth = 1; pg.fitToHeight = 0; }
    else if (override.auto) pg.fitToPage = false;
    let [w, h] = PAPER_IN[pg.paperSize] || PAPER_IN[9];
    if (pg.orientation === 'landscape') [w, h] = [h, w];
    const DPI = 96;
    const pageW = w * DPI, pageH = h * DPI;
    const mg = pg.margins;
    const printW = pageW - (mg.left + mg.right) * DPI;
    const printH = pageH - (mg.top + mg.bottom) * DPI;
    const area = override.area || printArea(sheet);
    const cw = [], rh = [];
    let totalW = 0, totalH = 0;
    for (let c = area.c1; c <= area.c2; c++) { cw[c] = colPx(sheet, c); totalW += cw[c]; }
    for (let r = area.r1; r <= area.r2; r++) { rh[r] = rowPx(sheet, r); totalH += rh[r]; }
    let scale = (pg.scale || 100) / 100;
    if (pg.fitToPage) {
      const sx = pg.fitToWidth > 0 ? (printW * pg.fitToWidth) / totalW : Infinity;
      const sy = pg.fitToHeight > 0 ? (printH * pg.fitToHeight) / totalH : Infinity;
      scale = Math.min(1, sx, sy);
    }
    scale = Math.max(0.1, Math.min(4, scale));
    const cut = (from, to, size, limit, manual) => {
      const out = [];
      let start = from, used = 0;
      for (let i = from; i <= to; i++) {
        const sz = size[i] * scale;
        if (used + sz > limit + 0.5 && i > start) { out.push([start, i - 1]); start = i; used = 0; }
        used += sz;
        if (manual.includes(i) && i < to) { out.push([start, i]); start = i + 1; used = 0; }
      }
      if (start <= to) out.push([start, to]);
      return out;
    };
    const rowsets = cut(area.r1, area.r2, rh, printH, pg.rowBreaks || []);
    const colsets = cut(area.c1, area.c2, cw, printW, pg.colBreaks || []);
    const pages = [];
    // Excel prints down, then over
    for (const [c1, c2] of colsets) for (const [r1, r2] of rowsets) pages.push({ r1, r2, c1, c2 });
    return { pages, scale, pageW, pageH, printW, printH, margins: mg, hCenter: pg.hCenter, vCenter: pg.vCenter, dpi: DPI };
  }

  function needsFit(sheet, pg) {
    if (pg.fitToPage) return false;
    let [w, h] = PAPER_IN[pg.paperSize] || PAPER_IN[9];
    if (pg.orientation === 'landscape') [w, h] = [h, w];
    const printW = (w - pg.margins.left - pg.margins.right) * 96;
    const area = printArea(sheet);
    let totalW = 0;
    for (let c = area.c1; c <= area.c2; c++) totalW += colPx(sheet, c);
    return totalW * (pg.scale || 100) / 100 > printW + 1;
  }
  /* Where the real form is: cells with text or borders, merged boxes with
   * text, pictures. Fill-only cells and far-away leftovers are ignored. */
  function contentArea(sheet) {
    if (sheet._content) return sheet._content;
    const rows = new Map(), cols = new Map();
    const bump = (m, k, n = 1) => m.set(k, (m.get(k) || 0) + n);
    const bordered = st => st && st.border && (st.border.left || st.border.right || st.border.top || st.border.bottom);
    const white = st => st && st.font && st.font.color && /^#?F{6}$/i.test(st.font.color.replace('#', ''));
    for (const cell of sheet.cells.values()) {
      if (colPx(sheet, cell.c) === 0 || rowPx(sheet, cell.r) === 0) continue; // hidden
      const st = sheet.styles.xfs[cell.s];
      const shows = cell.value != null && cell.value !== '' && !white(st);
      if (!shows && !bordered(st)) continue;
      bump(rows, cell.r); bump(cols, cell.c);
    }
    for (const m of sheet.merges) {
      const tl = sheet.cells.get(makeRef(m.r1, m.c1));
      if (!tl || tl.value == null || tl.value === '') continue;
      bump(rows, m.r2); bump(cols, m.c2);
    }
    for (const im of sheet.images) {
      if (!im.from) continue;
      const to = im.to || im.from;
      bump(rows, im.from.row + 1, 5); bump(rows, to.row + 1, 5); bump(cols, im.from.col + 1, 5); bump(cols, to.col + 1, 5);
    }
    // cut off small leftovers after a wide empty gap
    const trim = (m, gap) => {
      const keys = [...m.keys()].sort((a, b) => a - b);
      if (!keys.length) return [1, 1];
      const total = keys.reduce((a, k) => a + m.get(k), 0);
      let end = keys[keys.length - 1];
      for (let i = keys.length - 1; i > 0; i--) {
        if (keys[i] - keys[i - 1] > gap) {
          const tail = keys.slice(i).reduce((a, k) => a + m.get(k), 0);
          if (tail < total * 0.1) end = keys[i - 1];
        }
      }
      return [keys[0], end];
    };
    let [, r2] = trim(rows, 12);
    let [, c2] = trim(cols, 5);
    // a print area chosen by the template maker limits it further
    if (sheet.printArea) { r2 = Math.min(r2, sheet.printArea.r2); c2 = Math.min(c2, sheet.printArea.c2); }
    return (sheet._content = { r1: 1, c1: 1, r2: Math.max(1, r2), c2: Math.max(1, c2) });
  }

  /* Best way to print this form: try portrait and landscape, fit the width,
   * pick the one where the form comes out biggest, and put a form that only
   * just spills over onto one page. */
  function autoPage(sheet, o) {
    const area = contentArea(sheet);
    const m0 = sheet.page.margins;
    const ok = v => v >= 0.25 && v <= 0.8;
    const margins = [m0.left, m0.right, m0.top, m0.bottom].every(ok) ? m0 : { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5 };
    const base = Object.assign({}, o, { auto: true, area, margins, hCenter: true, noBreaks: true, fit: 'width', paper: o.paper || sheet.page.paperSize || 9 });
    // size of the form and of the printable part of the paper, per orientation
    let W = 0, H = 0;
    for (let c = area.c1; c <= area.c2; c++) W += colPx(sheet, c);
    for (let r = area.r1; r <= area.r2; r++) H += rowPx(sheet, r);
    let [pw, ph] = PAPER_IN[base.paper] || PAPER_IN[9];
    const opts = (o.orientation ? [o.orientation] : ['portrait', 'landscape']).map(orientation => {
      const [w, h] = orientation === 'landscape' ? [ph, pw] : [pw, ph];
      const printW = (w - margins.left - margins.right) * 96, printH = (h - margins.top - margins.bottom) * 96;
      return { orientation, sWidth: Math.min(1, printW / W), sPage: Math.min(1, printW / W, printH / H) };
    });
    // portrait for a form taller than wide (or nearly square), landscape for a wide one
    const orientation = o.orientation || (W > H * 1.15 ? 'landscape' : 'portrait');
    const pick = opts.find(x => x.orientation === orientation) || opts[0];
    const out = Object.assign({}, base, { orientation: pick.orientation, fit: pick.sPage >= 0.5 && pick.sPage < pick.sWidth - 0.001 ? 'page' : 'width' });
    return out;
  }

  /* The page options to write into the saved file (same rule as the screen).
   * fit 'auto': fit to width, and if only a little would spill onto an extra
   * page, fit the whole form on one page instead. */
  function effectivePage(sheet, override) {
    const o = Object.assign({}, override);
    if (o.fit === true) o.fit = 'width';
    if (o.fit === 'auto') return autoPage(sheet, o);
    if (o.fit === 'autoOld') {
      const lay = paginate(sheet, Object.assign({}, o, { fit: 'width' }));
      o.fit = 'width';
      if (lay.pages.length === 2) {
        const last = lay.pages[1];
        let h = 0;
        for (let r = last.r1; r <= last.r2; r++) h += rowPx(sheet, r);
        if (h * lay.scale < lay.printH * 0.25) o.fit = 'page';
      }
    }
    if (o.fit === 'width') {
      const pg = Object.assign({}, sheet.page);
      if (o.orientation) pg.orientation = o.orientation;
      if (o.paper) pg.paperSize = o.paper;
      if (!needsFit(sheet, pg)) o.fit = null;
    }
    return o;
  }

  function renderPages(sheet, override, opts = {}) {
    const lay = paginate(sheet, override);
    const n = lay.pages.length;
    const html = lay.pages.map((rg, i) => {
      let w = 0, h = 0;
      for (let c = rg.c1; c <= rg.c2; c++) w += colPx(sheet, c);
      for (let r = rg.r1; r <= rg.r2; r++) h += rowPx(sheet, r);
      const left = lay.margins.left * lay.dpi + (lay.hCenter ? Math.max(0, (lay.printW - w * lay.scale) / 2) : 0);
      const top = lay.margins.top * lay.dpi + (lay.vCenter ? Math.max(0, (lay.printH - h * lay.scale) / 2) : 0);
      return `<div class="xl-page" style="width:${lay.pageW}px;height:${lay.pageH}px">
        <div class="xl-page-area" style="left:${left}px;top:${top}px;transform:scale(${lay.scale})">${renderSheet(sheet, Object.assign({}, opts, { range: rg }))}</div>
        <div class="xl-page-no">Page ${i + 1} of ${n}</div>
      </div>`;
    }).join('');
    return { html: `<div class="xl-pages">${html}</div>`, count: n, layout: lay };
  }

  // ---------- filling ----------
  function prefixOf(node) { return node.prefix ? node.prefix + ':' : ''; }

  function findOrCreateRow(doc, sheetData, r) {
    const rows = kids(sheetData, 'row');
    for (const row of rows) {
      const rr = +row.getAttribute('r');
      if (rr === r) return row;
      if (rr > r) {
        const nr = doc.createElementNS(NS, prefixOf(sheetData) + 'row');
        nr.setAttribute('r', String(r));
        sheetData.insertBefore(nr, row);
        return nr;
      }
    }
    const nr = doc.createElementNS(NS, prefixOf(sheetData) + 'row');
    nr.setAttribute('r', String(r));
    sheetData.appendChild(nr);
    return nr;
  }

  function findOrCreateCell(doc, row, ref, colStyle) {
    const c = parseRef(ref).c;
    for (const cell of kids(row, 'c')) {
      const cc = parseRef(cell.getAttribute('r')).c;
      if (cc === c) return cell;
      if (cc > c) {
        const nc = doc.createElementNS(NS, prefixOf(row) + 'c');
        nc.setAttribute('r', ref);
        if (colStyle) nc.setAttribute('s', colStyle);
        row.insertBefore(nc, cell);
        return nc;
      }
    }
    const nc = doc.createElementNS(NS, prefixOf(row) + 'c');
    nc.setAttribute('r', ref);
    if (colStyle) nc.setAttribute('s', colStyle);
    row.appendChild(nc);
    return nc;
  }

  function setCellValue(doc, cellEl, value) {
    while (cellEl.firstChild) cellEl.removeChild(cellEl.firstChild);
    cellEl.removeAttribute('t');
    if (value === null || value === undefined || value === '') return;
    const p = prefixOf(cellEl);
    if (typeof value === 'number' && isFinite(value)) {
      const v = doc.createElementNS(NS, p + 'v');
      v.textContent = String(value);
      cellEl.appendChild(v);
      return;
    }
    cellEl.setAttribute('t', 'inlineStr');
    const is = doc.createElementNS(NS, p + 'is');
    const t = doc.createElementNS(NS, p + 't');
    t.setAttribute('xml:space', 'preserve');
    t.textContent = String(value);
    is.appendChild(t);
    cellEl.appendChild(is);
  }

  /* writesBySheet: {sheetPath: [{ref, value}]}
   * options.onlySheet: sheet path to keep visible (others are hidden)
   * Returns {blob, skipped:[refs that hold formulas]}
   */
  async function fillWorkbook(buffer, writesBySheet, options = {}) {
    const zip = await global.JSZip.loadAsync(buffer);
    const skipped = [];
    for (const path of Object.keys(writesBySheet)) {
      const raw = await zip.file(path).async('string');
      const decl = /^\s*<\?xml[^>]*\?>/.exec(raw);
      const doc = parseXml(raw);
      const sheetData = el(doc, 'sheetData');
      const colStyles = {};
      for (const c of els(el(doc, 'cols'), 'col')) {
        if (c.getAttribute('style') == null) continue;
        for (let i = +c.getAttribute('min'); i <= +c.getAttribute('max'); i++) colStyles[i] = c.getAttribute('style');
      }
      for (const w of writesBySheet[path]) {
        const p = parseRef(w.ref);
        const row = findOrCreateRow(doc, sheetData, p.r);
        row.removeAttribute('spans');
        const rowStyle = row.getAttribute('customFormat') === '1' ? row.getAttribute('s') : null;
        const cellEl = findOrCreateCell(doc, row, w.ref, rowStyle || colStyles[p.c]);
        if (kid(cellEl, 'f')) { skipped.push(w.ref); continue; }
        setCellValue(doc, cellEl, w.value);
      }
      // drop stale cached results so every program recomputes the totals
      for (const f of els(sheetData, 'f')) {
        const v = kid(f.parentNode, 'v');
        if (v) f.parentNode.removeChild(v);
        if (f.parentNode.getAttribute('t') === 'str' || f.parentNode.getAttribute('t') === 'e') f.parentNode.removeAttribute('t');
      }
      if (options.page && path === (options.pageSheet || options.onlySheet)) applyPage(doc, options.page);
      let out = new XMLSerializer().serializeToString(doc);
      if (decl && !/^\s*<\?xml/.test(out)) out = decl[0] + out;
      zip.file(path, out);
    }

    // recalculate formulas (totals) when the file is opened
    let wbXml = await zip.file('xl/workbook.xml').async('string');
    if (/<(\w+:)?calcPr\b/.test(wbXml)) {
      wbXml = wbXml.replace(/<((?:\w+:)?calcPr)\b([^>]*?)(\/?)>/, (all, tag, attrs, slash) =>
        /fullCalcOnLoad=/.test(attrs) ? all : `<${tag}${attrs} fullCalcOnLoad="1"${slash}>`);
    } else {
      const pre = (/<(\w+:)?workbook\b/.exec(wbXml) || [])[1] || '';
      const anchor = new RegExp(`</${pre}definedNames>|</${pre}sheets>`);
      const all = [...wbXml.matchAll(new RegExp(anchor, 'g'))];
      const m = all.find(x => x[0].includes('definedNames')) || all[0];
      if (m) wbXml = wbXml.slice(0, m.index + m[0].length) + `<${pre}calcPr fullCalcOnLoad="1"/>` + wbXml.slice(m.index + m[0].length);
    }

    if (options.page && options.page.area) wbXml = await setPrintArea(zip, wbXml, options.pageSheet || options.onlySheet, options.page.area);
    if (options.onlySheet) wbXml = await showOnlySheet(zip, wbXml, options.onlySheet);
    zip.file('xl/workbook.xml', wbXml);

    const blob = await zip.generateAsync({
      type: options.type || 'blob', compression: 'DEFLATE',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    return { data: blob, skipped };
  }

  /* Print options for the filled sheet. page = {fit, orientation, paper}
   * fit: scale to one page wide; orientation: 'portrait'|'landscape'|null
   * paper: Excel paperSize number or null (keep the template's)
   */
  // order of the page elements inside a worksheet (Excel refuses files with them out of order)
  const WS_ORDER = ['sheetCalcPr', 'sheetProtection', 'protectedRanges', 'scenarios', 'autoFilter', 'sortState', 'dataConsolidate', 'customSheetViews',
    'mergeCells', 'phoneticPr', 'conditionalFormatting', 'dataValidations', 'hyperlinks', 'printOptions', 'pageMargins', 'pageSetup', 'headerFooter',
    'rowBreaks', 'colBreaks', 'customProperties', 'cellWatches', 'ignoredErrors', 'smartTags', 'drawing', 'legacyDrawing', 'legacyDrawingHF', 'drawingHF',
    'picture', 'oleObjects', 'controls', 'webPublishItems', 'tableParts', 'extLst'];
  function ensureEl(doc, root, name) {
    let node = kid(root, name);
    if (node) return node;
    node = doc.createElementNS(NS, prefixOf(root) + name);
    const later = WS_ORDER.slice(WS_ORDER.indexOf(name) + 1);
    const anchor = Array.from(root.children).find(ch => later.includes(ch.localName));
    if (anchor) root.insertBefore(node, anchor); else root.appendChild(node);
    return node;
  }

  /* Print options for the filled sheet, the same ones the screen uses:
   * {fit: 'width'|'page'|null, orientation, paper, margins, hCenter, noBreaks, auto} */
  function applyPage(doc, page) {
    const root = doc.documentElement;
    if (!page.fit && !page.orientation && !page.paper && !page.auto) return;
    let sheetPr = kid(root, 'sheetPr');
    if (page.fit || page.auto) {
      if (!sheetPr) { sheetPr = doc.createElementNS(NS, prefixOf(root) + 'sheetPr'); root.insertBefore(sheetPr, root.firstElementChild); }
      let psp = kid(sheetPr, 'pageSetUpPr');
      if (!psp) {
        psp = doc.createElementNS(NS, prefixOf(root) + 'pageSetUpPr');
        const outline = kid(sheetPr, 'outlinePr') || kid(sheetPr, 'tabColor');
        if (outline && outline.nextSibling) sheetPr.insertBefore(psp, outline.nextSibling); else sheetPr.appendChild(psp);
      }
      psp.setAttribute('fitToPage', page.fit ? '1' : '0');
    }
    if (page.hCenter) ensureEl(doc, root, 'printOptions').setAttribute('horizontalCentered', '1');
    const pm = ensureEl(doc, root, 'pageMargins');
    const mg = page.margins || {};
