      const texts = [];
      for (let c = c1; c <= c2; c++) {
        const cell = sheet.cells.get(makeRef(r, c));
        if (cell && cell.type === 'string' && String(cell.value).trim()) texts.push(norm(cell.value));
      }
      const first = texts[0] || '';
      if (FOOTER.test(first)) {
        if (cur) { cur.last = r - 1; if (!cur.sex) cur.sex = sexOf(first); parts.push(cur); cur = null; }
        if (!/^total/.test(first)) break;
        continue;
      }
      if (texts.length === 1 && /^(male|female|boys|girls|m|f)$/.test(first)) { pendingSex = sexOf(first); continue; }
      if (rowPx(sheet, r) > 0 && rowPx(sheet, r) < 12 && !texts.length) continue; // thin spacer row
      const bordered = hasBorder(sheet, r, nc, 'bottom') || hasBorder(sheet, r, nc, 'left');
      if (bordered) {
        gap = 0;
        if (!cur) { cur = { first: r, last: r, sex: pendingSex }; pendingSex = null; }
        cur.last = r;
      } else {
        if (cur) { parts.push(cur); cur = null; }
        if (++gap >= 2 && parts.length) break;
      }
    }
    if (cur) parts.push(cur);
    if (!parts.length) return null;
    // a learner table has several rows and at least one column besides the name
    const rowCount = parts.reduce((a, p) => a + p.last - p.first + 1, 0);
    if (rowCount < 3 || columns.filter(c => c.key && c.key !== 'learner.name' && c.key !== 'row.no').length < 1) return null;
    const lastRow = parts[parts.length - 1].last;

    // extra columns: link totals to the scores they add up, and "< 27" checks to the total
    const cols = columns.filter(c => c.key);
    cols.forEach((c, i) => {
      if (c.input === 'total') {
        const keys = [];
        for (let j = i - 1; j >= 0 && (cols[j].input === 'number'); j--) {
          if (c.group && cols[j].group && cols[j].group !== c.group && keys.length) break;
          keys.unshift(cols[j].key);
        }
        c.sumOf = keys;
      }
    });
    const totals = cols.filter(c => c.input === 'total');
    const conds = cols.filter(c => c.input === 'cond');
    for (const c of conds) {
      const t = totals.filter(x => x.col < c.col).pop() || totals[0];
      c.of = t ? t.key : null;
      // "< 27" next to ">= 28" means 27 and below
      if (c.op === 'lt') { const ge = conds.find(x => x.op === 'ge'); if (ge && ge.n === c.n + 1) c.n = ge.n; }
    }
    // a SUM or COUNT under a tick column needs the number 1, not a check mark
    for (const c of cols) {
      if (!(c.input === 'check' || c.input === 'cond' || c.choice || c.flag)) continue;
      for (let rr = lastRow + 1; rr <= lastRow + 3; rr++) {
        const cell = sheet.cells.get(makeRef(rr, c.col));
        if (cell && cell.formula && /\b(SUM|COUNT)\(/i.test(cell.formula)) { c.mark = 1; break; }
      }
      if (c.mark == null) c.mark = '√';
    }
    // template cells that are formulas are left to Excel
    for (const c of cols) {
      const cell = sheet.cells.get(makeRef(parts[0].first, c.col));
      if (cell && cell.formula && c.key !== 'row.no') { c.input = 'formula'; }
    }

    // learners already written on the form (a filled template)
    const found = [];
    for (const p of parts) {
      for (let rr = p.first; rr <= p.last; rr++) {
        const name = cellText(sheet, rr, nc).trim();
        if (!name || /^\d+$/.test(name)) continue;
        const values = {};
        for (const c of cols) {
          const t = cellText(sheet, rr, c.col).trim();
          if (t !== '') values[c.col] = t;
        }
        found.push({ sex: p.sex, name, values });
      }
    }

    // on a filled form, use the tick the teacher already used ("1", "√", "/", "x")
    for (const c of cols) {
      if (!(c.input === 'check' || c.input === 'cond' || c.choice || c.flag)) continue;
      const seen = found.map(f => f.values[c.col]).filter(v => v != null && v !== '');
      if (seen.length < 2) continue;
      const counts = {};
      for (const v of seen) counts[v] = (counts[v] || 0) + 1;
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      if (top.length <= 2 && !/^x$/i.test(top) || c.input !== 'check') c.mark = top === '1' ? 1 : top;
    }

    return {
      id: 'L' + hr + '_' + nc,
      headerRows: [hr, headerEnd],
      nameCol: nc, noCol, cols: [c1, c2],
      parts: parts.map(p => ({ first: p.first, last: p.last, sex: p.sex })),
      lastRow,
      columns: cols,
      unknownColumns: columns.filter(c => !c.key).map(c => ({ col: c.col, label: c.label })),
      found,
    };
  }

  // Columns the app has no fixed meaning for (GST scores, Test Taken, ...):
  // they still become input columns, stored under their heading text.
  function extraMeaning(chain) {
    const raw = chain.join(' ');
    const joined = norm(raw);
    const key = 'x:' + joined.slice(0, 60);
    const group = chain.length > 1 ? norm(chain[0]) : null;
    const label = chain.join(' ');
    let m;
    if ((m = /(?:<|less than|below)\s*=?\s*(\d+)/i.exec(raw)) && !/>\s*\/?\s*=?\s*\d/.test(raw)) return { key, input: 'cond', op: 'lt', n: +m[1], label, group, conf: 0.8 };
    if ((m = /(?:>\s*\/?\s*=|>=|≥|at least)\s*(\d+)|(\d+)\s*(?:and above|or more|pataas)/i.exec(raw))) return { key, input: 'cond', op: 'ge', n: +(m[1] || m[2]), label, group, conf: 0.8 };
    if ((m = />\s*(\d+)/.exec(raw))) return { key, input: 'cond', op: 'ge', n: +m[1] + 1, label, group, conf: 0.8 };
    if (/\btotal\b/.test(joined)) return { key, input: 'total', label, group, conf: 0.8 };
    if (/[√✓]|\bcheck\b|\btick\b|\bput (a )?(1|check|x)\b|\bor x\b|\(x\)/i.test(raw)) {
      const mark = /put (a )?1/i.test(raw) ? 1 : /✓/.test(raw) ? '✓' : /\bx\b/i.test(raw) && !/[√✓]/.test(raw) ? 'X' : '√';
      return { key, input: 'check', mark, label, group, conf: 0.8 };
    }
    if (/score|literal|inferential|applied|critical|\bnumber\b|\bno of\b|\braw\b|%|rate|time|words|miscues|items|points|correct|\bage\b/.test(joined)) {
      return { key, input: 'number', label, group, conf: 0.75 };
    }
    return { key, input: 'text', label, group, conf: 0.6 };
  }

  function columnMeaning(chain) {
    const joined = norm(chain.join(' '));
    const child = norm(chain[chain.length - 1] || '');
    const mark = markFromText(joined);
    if (/\bnon ?readers?\b/.test(joined)) return { key: 'a.nonReader', flag: true, mark, conf: 0.85 };
    if (/\bstruggling\b/.test(joined)) return { key: 'a.struggling', flag: true, mark, conf: 0.85 };
    if ((chain[chain.length - 1] || '').trim() === '#') return { key: 'row.no', conf: 0.9 };
    for (const [lvl, re] of LEVEL_WORDS) {
      if (re.test(child) && child.split(' ').length <= 2 && !/level/.test(child)) return { key: 'a.level', choice: lvl, mark, conf: 0.9 };
    }
    if (INDEP.test(joined) && /where|in which|independent in|grade|level/.test(joined)) {
      return { key: 'a.indepGrade', conf: /where|in which|independent in/.test(joined) ? 0.8 : 0.65 };
    }
    for (const [lvl, re] of LEVEL_WORDS) {
      if (re.test(child) && child.split(' ').length <= 3) return { key: 'a.level', choice: lvl, mark, conf: 0.75 };
    }
    const extra = chain.length ? extraMeaning(chain) : null;
    if (extra && (extra.input === 'cond' || extra.input === 'total')) return extra;
    if (chain.length === 1 || child) {
      const hit = bestKey(child, COLUMN) || bestKey(joined, COLUMN);
      if (hit) {
        if (hit.key === 'learner.sex' && /^(m|male)$/.test(child)) return { key: 'learner.sex', choice: 'M', mark, conf: 0.7 };
        return { key: hit.key, conf: hit.conf };
      }
      if (/^(m|male|boys)$/.test(child)) return { key: 'learner.sex', choice: 'M', mark, conf: 0.6 };
      if (/^(f|female|girls)$/.test(child)) return { key: 'learner.sex', choice: 'F', mark, conf: 0.6 };
    }
    return extra || { key: null, conf: 0 };
  }

  // ---------- count tables (grade level / school summaries) ----------
  function findSummaries(sheet, skipRows) {
    const out = [];
    for (let r = 1; r <= Math.min(sheet.maxR, 200); r++) {
      if (skipRows.has(r)) continue;
      let mf = 0;
      for (let c = 1; c <= sheet.maxC; c++) {
        const t = norm(cellText(sheet, r, c));
        if (t === 'm' || t === 'f') mf++;
      }
      if (mf < 4) continue;
      const s = buildSummary(sheet, r);
      if (s) { out.push(s); r = s.rows[1]; }
    }
    return out;
  }

  function buildSummary(sheet, mfRow) {
    // group label column: first column whose header (merged down to mfRow) names sections/grades
    let labelCol = null, groupBy = null, top = mfRow;
    for (let c = 1; c <= sheet.maxC && !labelCol; c++) {
      for (let r = Math.max(1, mfRow - 4); r <= mfRow; r++) {
        const t = norm(textAt(sheet, r, c));
        if (!t) continue;
        if (/^section|^pangkat|^class/.test(t)) { labelCol = c; groupBy = 'section'; top = topLeft(sheet, r, c).r; break; }
        if (/^grade( level)?$|^grade level|^baitang/.test(t)) { labelCol = c; groupBy = 'grade'; top = topLeft(sheet, r, c).r; break; }
      }
    }
    if (!labelCol) return null;
    const columns = [];
    const unknown = [];
    for (let c = labelCol + 1; c <= sheet.maxC; c++) {
      const sx = norm(cellText(sheet, mfRow, c));
      if (!/^(m|f|t)$/.test(sx)) continue;
      const chain = [];
      for (let r = top; r < mfRow; r++) {
        const t = textAt(sheet, r, c).trim();
        if (t && chain[chain.length - 1] !== t) chain.push(t);
      }
      const joined = norm(chain.join(' '));
      const child = norm(chain[chain.length - 1] || '');
      let metric = null;
      if (/enrol/.test(joined)) metric = 'enrolled';
      else if (/\bnon ?readers?\b/.test(joined)) metric = 'nonReader';
      else if (/struggling/.test(joined)) metric = 'struggling';
      else if (INDEP.test(joined) && /grade (\d+)/.test(child)) metric = 'indepAt:' + /grade (\d+)/.exec(child)[1];
      else for (const [lvl, re] of LEVEL_WORDS) if (re.test(child)) { metric = 'level:' + lvl; break; }
      const sex = sx.toUpperCase();
      const label = chain.join(' › ') + ' › ' + sex;
      if (metric) columns.push({ col: c, metric, sex, label, conf: 0.85 });
      else unknown.push({ col: c, label });
    }
    // data rows until TOTAL
    let first = mfRow + 1, last = mfRow;
    for (let r = first; r <= Math.min(sheet.maxR, mfRow + 200); r++) {
      const t = norm(cellText(sheet, r, labelCol));
      if (FOOTER.test(t)) break;
      if (!hasBorder(sheet, r, labelCol, 'bottom') && !hasBorder(sheet, r, labelCol, 'left') && isEmpty(sheet, r, labelCol)) break;
      last = r;
    }
    if (last < first) return null;
    return { id: 'S' + mfRow, groupBy, labelCol, headerRows: [top, mfRow], rows: [first, last], columns, unknownColumns: unknown };
  }

  // ---------- single fields ----------
  const PERIOD_RE = /\b(mid[- ]?year|midyear|bosy|mosy|eosy|pre[- ]?test|post[- ]?test|beginning of (the )?school year|middle of (the )?school year|end of (the )?school year)\b/i;
  const SY_RE = /\b(19|20)\d{2}\s*[-–]\s*(19|20)\d{2}\b/;
  const SIGN_RE = /^(prepared by|prepared|noted by|noted|checked by|certified correct|certified by|submitted by|reviewed by|approved by|attested by)$/;
  const ROLE = [
    ['school.head', /school head|principal|punong guro|head teacher/],
    ['school.chair', /chair/],
    ['school.coordinator', /coordinator/],
    ['class.adviser', /adviser|teacher|assessor|guro/],
  ];

  function findFields(sheet, tableRows) {
    const fields = [];
    const add = f => { f.id = 'F' + (fields.length + 1); f.label = FIELD_LABELS[f.key] || f.key; fields.push(f); };
    const taken = new Set();
    for (const cell of sheet.cells.values()) {
      if (cell.type !== 'string') continue;
      const raw = String(cell.value);
      const n = norm(raw);
      if (!n) continue;
      const inTable = tableRows.has(cell.r);

      // "___/___Pre-Test ____ Post Test": a tick slot before each period word
      const tickRe = /(_+\s*[\/√✓xX]?\s*_*)\s*(pre[- ]?test|post[- ]?test|mid[- ]?year|bosy|mosy|eosy)/gi;
      let tm, ti = 0, hasTick = false;
      while ((tm = tickRe.exec(raw))) {
        const w = tm[2].toLowerCase();
        const P = /^pre|bosy/.test(w) ? 'BOSY' : /^post|eosy/.test(w) ? 'EOSY' : 'MOSY';
        add({ ref: cell.ref, key: 'tick:' + P, mode: 'tick', tickIndex: ti++, conf: 0.85 });
        hasTick = true;
      }
      if (hasTick) continue;

      // ____ blanks: "GRADE _____", "Female: _____", "Grade ____ Level Text"
      const blankRe = /_{3,}/g;
      let m, idx = 0, prevEnd = 0;
      while ((m = blankRe.exec(raw))) {
        const after = raw.slice(m.index + m[0].length);
        const tick = /^\s*\/?\s*(pre[- ]?test|bosy|beginning)/i.test(after) ? 'BOSY' : /^\s*\/?\s*(post[- ]?test|eosy|end of)/i.test(after) ? 'EOSY' : /^\s*\/?\s*(mid[- ]?year|mosy|middle)/i.test(after) ? 'MOSY' : null;
        if (tick) { add({ ref: cell.ref, key: 'tick:' + tick, mode: 'blank', blankIndex: idx, conf: 0.85 }); idx++; prevEnd = m.index + m[0].length; continue; }
        const labelTxt = norm(raw.slice(prevEnd, m.index));
        const words = labelTxt.split(' ');
        const cands = [words[words.length - 1], words.slice(-2).join(' '), labelTxt].map(t => bestKey(t, SINGLE));
        const hit = cands.find(h => h && h.conf >= 0.99) || cands[2] || cands[1] || cands[0];
        if (hit) add({ ref: cell.ref, key: hit.key, mode: 'blank', blankIndex: idx, conf: inTable ? 0.7 : hit.conf * 0.95 });
        idx++; prevEnd = m.index + m[0].length;
      }
      if (inTable) continue;

      // (PLACEHOLDER) cells: "(DISTRICT)", "(SCHOOL ID - SCHOOL NAME)", "(Designation)"
      const ph = /^\s*\(([^()]+)\)\s*$/.exec(raw);
      if (ph) {
        const inner = norm(ph[1]);
        const hit = /school id/.test(inner) && /school name|name/.test(inner) ? { key: 'school.idName', conf: 0.9 } : bestKey(inner, SINGLE);
        if (hit && !PERIOD_RE.test(ph[1])) { add({ ref: cell.ref, key: hit.key, mode: 'value', conf: Math.max(0.8, hit.conf * 0.9) }); taken.add(cell.ref); continue; }
      }
      // SCHOOL YEAR 2025-2026
      const sy = SY_RE.exec(raw);
      if (sy) add({ ref: cell.ref, key: 'sy', mode: 'find', find: sy[0], conf: 0.9 });
      // (MIDYEAR), PRE-TEST ...
      const pm = PERIOD_RE.exec(raw);
      if (pm && raw.length > pm[0].length + 2 && !fields.some(f => f.ref === cell.ref && f.key.startsWith('tick:'))) add({ ref: cell.ref, key: 'period', mode: 'find', find: pm[0], conf: 0.85 });
      // "... READING LEVEL IN FILIPINO" in titles
      const lm = /\b(filipino|english)\b/i.exec(raw);
      if (lm && /report|profile|summary|reading|inventory/.test(n) && raw.length > 20) add({ ref: cell.ref, key: 'language', mode: 'find', find: lm[0], conf: 0.8 });

      // signature blocks: "Prepared by:" with a name line below
      if (SIGN_RE.test(n)) {
        const t = signatureTarget(sheet, cell.r, cell.c);
        if (t && !taken.has(t.ref)) {
          const caption = norm(cellText(sheet, t.captionRow, t.c) || textAt(sheet, t.captionRow, t.c));
          const role = ROLE.find(([, re]) => re.test(caption));
          const key = role ? role[0] : (/noted|approved|attested/.test(n) ? 'school.head' : 'class.adviser');
          add({ ref: t.ref, key, mode: 'value', conf: role ? 0.75 : 0.55 });
          taken.add(t.ref);
        }
        continue;
      }

      // "School: Ocampo National High School" - label and value in one cell
      const lv = /^\s*([A-Za-z][^:_]{1,40}?)\s*:\s*(\S.*?)\s*$/.exec(raw);
      if (lv && !/_{3,}/.test(raw)) {
        const hit = bestKey(norm(lv[1]), SINGLE, k => k.startsWith('count.') || k.startsWith('learner.'));
        if (hit) { add({ ref: cell.ref, key: hit.key, mode: 'after', current: lv[2], conf: hit.conf * 0.9 }); taken.add(cell.ref); continue; }
      }

      // "SECTION :" / "Assessor:" with a value cell to the right
      const endsColon = /:\s*$/.test(raw);
      const hit = bestKey(n, SINGLE, k => k.startsWith('count.') || k.startsWith('learner.') && !endsColon);
      if (hit && !/_{3,}/.test(raw)) {
        const t = rightTarget(sheet, cell.r, cell.c);
        if (t && (endsColon || t.bordered) && !taken.has(t.ref)) {
          add({ ref: t.ref, key: hit.key, mode: 'value', conf: hit.conf * (t.bordered ? 0.95 : 0.8) });
          taken.add(t.ref);
        } else if (endsColon && !taken.has(cell.ref)) {
          // "School:" in a wide cell with no box next to it: write after the colon
          add({ ref: cell.ref, key: hit.key, mode: 'after', current: '', conf: hit.conf * 0.8 });
          taken.add(cell.ref);
        }
      }
    }
    // role captions ("School Head") with an empty name line right above
    for (const cell of sheet.cells.values()) {
      if (cell.type !== 'string' || tableRows.has(cell.r) || cell.r < 2) continue;
      if (/:\s*$|_{3,}/.test(cell.value)) continue; // a label, not a caption under a name line
      const n = norm(cell.value);
      const role = ROLE.find(([, re]) => re.test(n) && n.split(' ').length <= 4);
      if (!role) continue;
      const above = topLeft(sheet, cell.r - 1, cell.c);
      const ref = makeRef(above.r, above.c);
      if (!taken.has(ref) && isEmpty(sheet, above.r, above.c) && !fields.some(f => f.ref === ref)) {
        add({ ref, key: role[0], mode: 'value', conf: 0.6 });
        taken.add(ref);
      }
    }
    return fields;
  }

  function rightTarget(sheet, r, c) {
    const m = mergeAt(sheet, r, c);
    const start = (m ? m.c2 : c) + 1;
    let firstEmpty = null;
    for (let cc = start; cc <= Math.min(start + 4, sheet.maxC + 1); cc++) {
      const tl = topLeft(sheet, r, cc);
      if (!isEmpty(sheet, r, cc)) break;
      const bordered = hasBorder(sheet, r, cc, 'bottom');
      const ref = makeRef(tl.r, tl.c);
      if (bordered) return { ref, bordered: true };
      if (!firstEmpty) firstEmpty = { ref, bordered: false };
      if (tl.m) cc = tl.m.c2;
    }
    return firstEmpty;
  }

  function signatureTarget(sheet, r, c) {
    for (let rr = r + 1; rr <= r + 4; rr++) {
      for (let cc = c; cc <= c + 3; cc++) {
        const tl = topLeft(sheet, rr, cc);
        if (!isEmpty(sheet, tl.r, tl.c)) continue;
        const below = (tl.m ? tl.m.r2 : tl.r) + 1;
        if (textAt(sheet, below, tl.c) || hasBorder(sheet, tl.r, tl.c, 'bottom')) {
          return { ref: makeRef(tl.r, tl.c), c: tl.c, captionRow: below };
        }
      }
    }
    return null;
  }

  // how much of the form is written in Filipino vs English (header and column words)
  const FIL_WORDS = /\b(pangalan|paaralan|baitang|seksyon|pangkat|guro|petsa|talaan|pagtatasa|pangkatang|kabuuang|bilang|tamang|sagot|paghihinuha|kritikal|iskor|nakuha|distrito|mag-?aaral|antas|marka|panuto|lagda|inihanda|binigyang)\b/gi;
  const ENG_WORDS = /\b(name|school|grade|section|teacher|date|record|assessment|total|score|number|correct|responses|literal|inferential|critical|region|department|education|division|district|learners?|level|prepared|noted)\b/gi;
  function formWording(sheet) {
    let fil = 0, eng = 0;
    for (const cell of sheet.cells.values()) {
      if (cell.type !== 'string') continue;
      const t = String(cell.value);
      fil += (t.match(FIL_WORDS) || []).length;
      eng += (t.match(ENG_WORDS) || []).length;
    }
    return { fil, eng };
  }

  // ---------- whole sheet ----------
  function detectSheet(sheet) {
    const lists = findLists(sheet);
    const tableRows = new Set();
    for (const l of lists) for (let r = l.headerRows[0]; r <= l.lastRow + 1; r++) tableRows.add(r);
    const summaries = findSummaries(sheet, tableRows);
    for (const s of summaries) for (let r = s.headerRows[0]; r <= s.rows[1] + 1; r++) tableRows.add(r);
    const fields = findFields(sheet, tableRows);

    let kind = 'none';
    const notes = /instruction|direction|guide|read ?me|legend|how to/i.test(sheet.name);
    if (lists.length) kind = 'class';
    else if (summaries.length) kind = summaries[0].groupBy === 'section' ? 'grade' : 'school';
    else if (fields.some(f => f.key === 'learner.name')) kind = 'learner';

    let language = null;
    if (/\bfil(ipino)?\b|\bfil\s|^fil|\bfil[-_]/i.test(sheet.name)) language = 'Filipino';
    else if (/\beng(lish)?\b|^eng|\beng[-_]/i.test(sheet.name)) language = 'English';
    else {
      // a title that names the language ("... IN FILIPINO") wins; otherwise the wording of the form decides
      const lf = fields.find(f => f.key === 'language' && f.mode === 'find');
      const words = formWording(sheet);
      if (lf) language = /fil/i.test(lf.find) ? 'Filipino' : 'English';
      if (words.fil >= 4 && words.fil > words.eng * 1.5) language = 'Filipino';
      else if (!lf && words.eng >= 4 && words.eng > words.fil * 1.5) language = null; // English wording alone does not say which test it is
    }
    return {
      sheetPath: sheet.path, sheetName: sheet.name, sheetIndex: sheet.index, hidden: sheet.hidden,
      kind, language, fields, lists, summaries, checked: false, notes,
    };
  }

  global.Detect = { detectSheet, FIELD_LABELS, norm };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* App data: storage, reading-level rules, and turning records into cell writes. */
(function (global) {
  'use strict';

  const PERIODS = ['BOSY', 'MOSY', 'EOSY'];
  const LANGS = ['Filipino', 'English'];
  const LEVELS = ['Independent', 'Instructional', 'Frustration'];

  function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

  function emptyState() {
    return {
      v: 1,
      sample: false,
      school: { name: '', id: '', district: '', division: '', region: '', head: '', chair: '', coordinator: '' },
      sy: defaultSY(),
      settings: {
        nameOrder: 'last',        // "DELA CRUZ, Juan P." or "Juan P. Dela Cruz"
        upperNames: false,
        periodNames: { BOSY: 'BEGINNING OF THE SCHOOL YEAR', MOSY: 'MIDYEAR', EOSY: 'END OF THE SCHOOL YEAR' },
        defaultMark: '1',
        rules: { word: { indep: 97, inst: 90 }, comp: { indep: 80, inst: 59 } },
        combine: 'lower',
      },
      classes: [],
      results: {},
      dates: {},
      templates: [],
      ui: {},
    };
  }
  function defaultSY() {
    const d = new Date();
    const y = d.getMonth() >= 5 ? d.getFullYear() : d.getFullYear() - 1; // school year starts around June
    return `${y}-${y + 1}`;
  }

  // ---------- storage (IndexedDB, falls back to memory) ----------
  const mem = new Map();
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      try {
        const req = indexedDB.open('phil-iri-recorder', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
    return dbp;
  }
  async function kvGet(key) {
    const d = await db();
    if (!d) return mem.get(key);
    return new Promise(res => {
      try {
        const r = d.transaction('kv').objectStore('kv').get(key);
        r.onsuccess = () => res(r.result); r.onerror = () => res(mem.get(key));
      } catch (e) { res(mem.get(key)); }
    });
  }
  async function kvSet(key, val) {
    mem.set(key, val);
    const d = await db();
    if (!d) return false;
    return new Promise(res => {
      try {
        const tx = d.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(val, key);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  async function kvDel(key) {
    mem.delete(key);
    const d = await db();
    if (!d) return;
    try { d.transaction('kv', 'readwrite').objectStore('kv').delete(key); } catch (e) { /* ignore */ }
  }
  const persistent = async () => !!(await db());

  // ---------- names & results ----------
  function fullName(l, settings) {
    const mi = l.middle ? l.middle.trim()[0].toUpperCase() + '.' : '';
    let s = settings.nameOrder === 'first'
      ? [l.first, mi, l.last, l.ext].filter(Boolean).join(' ')
      : `${l.last || ''}${l.ext ? ' ' + l.ext : ''}, ${[l.first, mi].filter(Boolean).join(' ')}`.trim();
    s = s.replace(/^,\s*/, '').replace(/,\s*$/, '');
    return settings.upperNames ? s.toUpperCase() : s;
  }
  // learners stay in the order the teacher entered them (usually boys first, then girls)
  function sortLearners(list) {
    return list.slice();
  }
  function result(state, learnerId, period, lang) {
    return (((state.results[learnerId] || {})[period] || {})[lang]) || {};
  }
  function setResult(state, learnerId, period, lang, patch) {
    const r = state.results[learnerId] = state.results[learnerId] || {};
    const p = r[period] = r[period] || {};
    p[lang] = Object.assign({}, p[lang] || {}, patch);
  }

  // Phil-IRI oral reading: suggest a level from raw scores
  function scoreLevel(pct, rule) {
    if (pct == null || isNaN(pct)) return null;
    if (pct >= rule.indep) return 'Independent';
    if (pct >= rule.inst) return 'Instructional';
    return 'Frustration';
  }
  function computed(res, settings) {
    const out = {};
    const words = +res.words, miscues = +res.miscues, correct = +res.compCorrect, items = +res.compTotal, time = +res.time;
    if (words > 0 && res.miscues !== '' && res.miscues != null) out.wordPct = Math.round(((words - miscues) / words) * 1000) / 10;
    if (items > 0 && res.compCorrect !== '' && res.compCorrect != null) out.compPct = Math.round((correct / items) * 1000) / 10;
    if (words > 0 && time > 0) out.wpm = Math.round(words / (time / 60));
    const wl = scoreLevel(out.wordPct, settings.rules.word);
    const cl = scoreLevel(out.compPct, settings.rules.comp);
    if (wl && cl) {
      if (settings.combine === 'comp') out.suggested = cl;
      else if (settings.combine === 'word') out.suggested = wl;
      else out.suggested = LEVELS[Math.max(LEVELS.indexOf(wl), LEVELS.indexOf(cl))];
    } else out.suggested = wl || cl || null;
    return out;
  }

  // ---------- turning records into cell writes ----------
  function matchCase(sample, value) {
    const letters = sample.replace(/[^A-Za-z]/g, '');
    if (letters && letters === letters.toUpperCase()) return String(value).toUpperCase();
    return String(value);
  }

  function groupLearners(state, ctx) {
    const classes = state.classes.filter(c => c.sy === state.sy);
    if (ctx.kind === 'class' || ctx.kind === 'learner') {
      const cls = classes.find(c => c.id === ctx.classId);
      return cls ? cls.learners : [];
    }
    if (ctx.kind === 'grade') return classes.filter(c => String(c.grade) === String(ctx.grade)).flatMap(c => c.learners);
    return classes.flatMap(c => c.learners);
  }

  function singleValue(key, state, ctx) {
    const s = state.school;
    const cls = state.classes.find(c => c.id === ctx.classId) || {};
    const learners = groupLearners(state, ctx);
    const grade = ctx.kind === 'grade' ? ctx.grade : cls.grade;
    switch (key) {
      case 'school.name': return s.name;
      case 'school.id': return s.id;
      case 'school.idName': return [s.id, s.name].filter(Boolean).join(' - ');
      case 'school.district': return s.district;
      case 'school.division': return s.division;
      case 'school.region': return s.region;
      case 'school.head': return s.head;
      case 'school.chair': return s.chair;
      case 'school.coordinator': return s.coordinator;
      case 'sy': return state.sy;
      case 'period': return state.settings.periodNames[ctx.period] || ctx.period;
      case 'language': return ctx.lang;
      case 'date': return ctx.date || (state.dates || {})[`${ctx.classId}:${ctx.period}`] || '';
      case 'class.grade': return grade != null ? String(grade) : '';
      case 'class.section': return cls.section || '';
      case 'class.gradeSection': return cls.grade ? (cls.section && cls.section.length <= 3 ? `${cls.grade}-${cls.section}` : `Grade ${cls.grade} - ${cls.section || ''}`) : '';
      case 'class.adviser': return cls.adviser || '';
      case 'class.designation': return cls.designation || '';
      case 'count.male': return learners.filter(l => l.sex === 'M').length;
      case 'count.female': return learners.filter(l => l.sex === 'F').length;
      case 'count.total': return learners.length;
      case 'tick:BOSY': case 'tick:MOSY': case 'tick:EOSY': return key.slice(5) === ctx.period ? '√' : '';
      case 'learner.name': return ctx.learner ? fullName(ctx.learner, state.settings) : '';
      case 'learner.lrn': return ctx.learner ? ctx.learner.lrn || '' : '';
      case 'learner.sex': return ctx.learner ? ctx.learner.sex || '' : '';
      default: return '';
    }
  }

  const numOf = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
  // value of a template-specific column (scores, ticks, totals) for one learner
  function extraValue(col, res) {
    const x = res.x || {};
    if (col.input === 'total') {
      const parts = (col.sumOf || []).map(k => numOf(x[k])).filter(v => v != null);
      return parts.length ? parts.reduce((a, b) => a + b, 0) : numOf(x[col.key]);
    }
    if (col.input === 'cond') {
      const t = col.of ? col.ofValue : null;
      if (t == null) return null;
      return col.op === 'lt' ? t < col.n : t >= col.n;
    }
    if (col.input === 'check') return !!x[col.key];
    return x[col.key] ?? null;
  }
  // totals of a row, so "Score < 27" can look at "Total Score"
  function withTotals(columns, res) {
    return columns.map(c => {
      if (c.input !== 'cond') return c;
      const t = columns.find(k => k.key === c.of);
      return Object.assign({}, c, { ofValue: t ? extraValue(t, res) : null });
    });
  }

  function columnValue(col, learner, index, state, ctx) {
    const res = result(state, learner.id, ctx.period, ctx.lang);
    const comp = computed(res, state.settings);
    const mark = col.mark != null ? (String(col.mark) === '1' ? 1 : col.mark) : (state.settings.defaultMark === '1' ? 1 : state.settings.defaultMark);
    if (col.key && col.key.startsWith('x:')) {
      if (col.input === 'formula') return null;
      const v = extraValue(col, res);
      if (col.input === 'check' || col.input === 'cond') return v ? mark : null;
      if (col.input === 'number' || col.input === 'total') return numOf(v);
      return v === '' ? null : v;
    }
    switch (col.key) {
      case 'row.no': return index + 1;
      case 'learner.name': return fullName(learner, state.settings);
      case 'learner.lrn': return learner.lrn || '';
      case 'learner.sex': return col.choice ? (learner.sex === col.choice ? mark : null) : (learner.sex || '');
      case 'a.level': {
        const lvl = res.level || comp.suggested || '';
        if (col.choice) return lvl === col.choice ? mark : null;
        return lvl;
      }
      case 'a.indepGrade': return res.indepGrade ? `Grade ${res.indepGrade}` : null;
      case 'a.struggling': return res.struggling ? mark : null;
      case 'a.nonReader': return res.nonReader ? mark : null;
      case 'a.remarks': return res.remarks || null;
      case 'a.gst': return res.gst !== '' && res.gst != null ? +res.gst : null;
      case 'a.miscues': return res.miscues !== '' && res.miscues != null ? +res.miscues : null;
      case 'a.words': return res.words ? +res.words : null;
      case 'a.time': return res.time ? +res.time : null;
      case 'a.compCorrect': return res.compCorrect !== '' && res.compCorrect != null ? +res.compCorrect : null;
      case 'a.wordPct': return comp.wordPct ?? null;
      case 'a.compPct': return comp.compPct ?? null;
      case 'a.wpm': return comp.wpm ?? null;
      default: return null;
    }
  }

  function countMetric(metric, learners, state, ctx) {
    return learners.filter(l => {
      if (metric === 'enrolled') return true;
      const res = result(state, l.id, ctx.period, ctx.lang);
      if (metric === 'struggling') return !!res.struggling;
      if (metric === 'nonReader') return !!res.nonReader;
      if (metric.startsWith('level:')) return (res.level || computed(res, state.settings).suggested) === metric.slice(6);
      if (metric.startsWith('indepAt:')) return String(res.indepGrade || '') === metric.slice(8);
      return false;
    }).length;
  }

  /* Build the cell writes for one sheet mapping.
   * Returns {pages:[[{ref,value}]], warnings:[]} - one page per output file.
   */
  function buildWrites(mapping, sheet, state, ctx) {
    const warnings = [];
    const base = [];
    // single fields, grouped per cell so several edits to one text combine
    const byRef = {};
    for (const f of mapping.fields) (byRef[f.ref] = byRef[f.ref] || []).push(f);
    for (const ref in byRef) {
      const fs = byRef[ref];
      const p = global.XL.parseRef(ref);
      const original = global.XL.cellText(sheet, p.r, p.c);
      const plain = fs.find(f => f.mode === 'value');
      if (plain) {
        const v = singleValue(plain.key, state, ctx);
        if (v === '' || v == null) { warnings.push(`No value for “${plain.label}” (cell ${ref}).`); continue; }
        base.push({ ref, value: v });
        continue;
      }
      let text = original;
      const after = fs.find(f => f.mode === 'after');
      if (after && after.key === 'date' && after.current && !(state.dates || {})[`${ctx.classId}:${ctx.period}`]) {
        // keep the date already written on the form
      } else if (after) {
        const v = singleValue(after.key, state, ctx);
        if (v === '' || v == null) warnings.push(`No value for “${after.label}” (cell ${ref}).`);
        else text = text.replace(/^(\s*[^:]*:)(\s*).*$/s, (m, head, sp) => head + (sp || ' ') + v);
      }
      const blanks = fs.filter(f => f.mode === 'blank').sort((a, b) => b.blankIndex - a.blankIndex);
      for (const f of blanks) {
        const v = singleValue(f.key, state, ctx);
        if (v === '' || v == null) { if (!f.key.startsWith('tick:')) warnings.push(`No value for “${f.label}” (cell ${ref}).`); continue; }
        const runs = [...text.matchAll(/_{3,}/g)];
        const run = runs[f.blankIndex];
        if (run) text = text.slice(0, run.index) + String(v) + text.slice(run.index + run[0].length);
      }
      const ticks = fs.filter(f => f.mode === 'tick');
      if (ticks.length) {
        let k = 0;
        text = text.replace(/(_+\s*[\/√✓xX]?\s*_*)(\s*)(pre[- ]?test|post[- ]?test|mid[- ]?year|bosy|mosy|eosy)/gi, (m, slot, sp, word) => {
          const f = ticks.find(t => t.tickIndex === k++);
          if (!f) return m;
          const len = Math.max(3, slot.replace(/\s/g, '').length);
          const on = f.key.slice(5) === ctx.period;
          const half = Math.floor((len - 1) / 2);
          return (on ? '_'.repeat(half) + '√' + '_'.repeat(len - 1 - half) : '_'.repeat(len)) + sp + word;
        });
      }
      for (const f of fs.filter(f => f.mode === 'find')) {
        const v = singleValue(f.key, state, ctx);
        if (v === '' || v == null) continue;
        const i = text.toLowerCase().indexOf(String(f.find).toLowerCase());
        if (i >= 0) text = text.slice(0, i) + matchCase(f.find, v) + text.slice(i + f.find.length);
      }
      if (text !== original) base.push({ ref, value: text });
    }

    // summaries (counts per section / grade level)
    for (const s of mapping.summaries) {
      const classes = state.classes.filter(c => c.sy === state.sy);
      let groups;
      if (s.groupBy === 'section') {
        groups = classes.filter(c => String(c.grade) === String(ctx.grade))
          .sort((a, b) => (a.section || '').localeCompare(b.section || ''))
          .map(c => ({ label: c.section || '(no section)', learners: c.learners }));
      } else {
        const grades = [...new Set(classes.map(c => String(c.grade)))].sort((a, b) => (+a) - (+b));
        groups = grades.map(g => ({ label: `Grade ${g}`, learners: classes.filter(c => String(c.grade) === g).flatMap(c => c.learners) }));
      }
      const cap = s.rows[1] - s.rows[0] + 1;
      if (groups.length > cap) warnings.push(`The count table has room for ${cap} rows but there are ${groups.length}. Only the first ${cap} are filled.`);
      if (!groups.length) warnings.push(s.groupBy === 'section' ? `There are no classes for Grade ${ctx.grade} in ${state.sy}.` : `There are no classes in ${state.sy}.`);
      groups.slice(0, cap).forEach((g, i) => {
        const r = s.rows[0] + i;
        base.push({ ref: global.XL.makeRef(r, s.labelCol), value: g.label });
        for (const col of s.columns) {
          const list = col.sex === 'T' ? g.learners : g.learners.filter(l => l.sex === col.sex);
          base.push({ ref: global.XL.makeRef(r, col.col), value: countMetric(col.metric, list, state, ctx) });
        }
      });
    }

    // learner tables (may need more than one page)
    const pages = [];
    const listPlans = mapping.lists.map(l => {
      const all = sortLearners(groupLearners(state, ctx));
      const hasSexParts = l.parts.some(p => p.sex);
      const parts = l.parts.map(p => {
        let learners = hasSexParts ? all.filter(x => x.sex === p.sex) : all;
        if (!hasSexParts) learners = [...all.filter(x => x.sex === 'M'), ...all.filter(x => x.sex !== 'M')];
        return { part: p, learners, cap: p.last - p.first + 1 };
      });
      if (!hasSexParts && parts.length > 1) {
        // one list spread over several blocks: fill them in order
        let rest = parts[0].learners;
        for (const pp of parts) { pp.learners = rest.slice(0, pp.cap); rest = rest.slice(pp.cap); }
        parts[parts.length - 1].learners = parts[parts.length - 1].learners.concat(rest);
      }
      const noSex = all.filter(x => x.sex !== 'M' && x.sex !== 'F');
      if (hasSexParts && noSex.length) warnings.push(`${noSex.length} learner(s) have no sex recorded and are left out of this form.`);
      return { list: l, parts };
    });
    const pageCount = Math.max(1, ...listPlans.flatMap(lp => lp.parts.map(pp => Math.ceil(pp.learners.length / pp.cap) || 1)));
    // a template that was already filled in: clear the old entries in the learner rows first
    const clears = [];
    for (const lp of listPlans) {
      for (const p of lp.list.parts) for (let r = p.first; r <= p.last; r++) {
        for (const col of lp.list.columns) {
          if (col.key === 'row.no' || col.input === 'formula') continue;
          const ref = global.XL.makeRef(r, col.col);
          const cell = sheet.cells.get(ref);
          if (cell && cell.value != null && cell.value !== '' && !cell.formula) clears.push({ ref, value: null });
        }
      }
    }
    for (let pg = 0; pg < pageCount; pg++) {
      const writes = base.concat(clears);
      for (const lp of listPlans) {
        for (const pp of lp.parts) {
          const slice = pp.learners.slice(pg * pp.cap, (pg + 1) * pp.cap);
          slice.forEach((learner, i) => {
            const r = pp.part.first + i;
            const rowCols = withTotals(lp.list.columns, result(state, learner.id, ctx.period, ctx.lang));
            for (const col of rowCols) {
              const v = columnValue(col, learner, pg * pp.cap + i, state, ctx);
              if (v === null || v === undefined || v === '') continue;
              writes.push({ ref: global.XL.makeRef(r, col.col), value: v });
            }
          });
        }
      }
      // never overwrite the template's own formulas (totals)
      pages.push(writes.filter(w => { const c = sheet.cells.get(w.ref); return !(c && c.formula); }));
    }
    if (pageCount > 1) warnings.push(`There are more learners than rows on the form, so it will be saved as ${pageCount} pages (separate files).`);
    return { pages, warnings };
  }

  // Missing entries that would leave the form incomplete
  function missingResults(state, ctx, mapping) {
    if (mapping && !mapping.lists.some(l => l.columns.some(c => c.key === 'a.level'))) return [];
    const learners = groupLearners(state, ctx);
    return learners.filter(l => {
      const res = result(state, l.id, ctx.period, ctx.lang);
      return !res.level && !computed(res, state.settings).suggested && !res.nonReader;
    });
  }

  function parseName(text) {
    const l = { id: uid('l'), lrn: '', last: '', first: '', middle: '', ext: '', sex: '' };
    const t = String(text).replace(/\s+/g, ' ').trim();
    if (t.includes(',')) {
      const [last, rest = ''] = t.split(/,(.*)/s);
      const parts = rest.trim().split(' ').filter(Boolean);
      l.last = last.trim();
      const ext = parts.findIndex(p => /^(jr\.?|sr\.?|ii|iii|iv)$/i.test(p));
      if (ext >= 0) l.ext = parts.splice(ext, 1)[0];
      if (parts.length > 1 && /^[A-Za-z]\.?$/.test(parts[parts.length - 1])) l.middle = parts.pop().replace(/\.$/, '');
      else if (parts.length > 2) l.middle = parts.pop();
      l.first = parts.join(' ');
    } else {
      const parts = t.split(' ');
      l.last = parts.length > 1 ? parts.pop() : t;
      l.first = parts.join(' ');
    }
    return l;
  }
  const truthy = v => v != null && String(v).trim() !== '' && !/^(x|0|no|false)$/i.test(String(v).trim());

  // rows = list.found from detection; returns learners added
  function importFound(state, cls, list, period, lang) {
    const added = [];
    for (const row of list.found || []) {
      const l = parseName(row.name);
      l.sex = row.sex || '';
      const patch = { x: {} };
      for (const c of list.columns) {
        const v = row.values[c.col];
        if (v == null) continue;
        if (c.key === 'learner.lrn') l.lrn = v;
        else if (c.key === 'learner.sex' && !c.choice) l.sex = /^f/i.test(v) ? 'F' : /^m/i.test(v) ? 'M' : l.sex;
        else if (c.key === 'learner.sex' && c.choice && truthy(v)) l.sex = c.choice;
        else if (c.key === 'a.level' && c.choice) { if (truthy(v)) patch.level = c.choice; }
        else if (c.key === 'a.level') { const m = LEVELS.find(x => x.toLowerCase().startsWith(String(v).toLowerCase().slice(0, 4))); if (m) patch.level = m; }
        else if (c.key === 'a.indepGrade') { const m = /(\d+)/.exec(v); if (m) patch.indepGrade = m[1]; }
        else if (c.key === 'a.struggling') patch.struggling = truthy(v);
        else if (c.key === 'a.nonReader') patch.nonReader = truthy(v);
        else if (c.key === 'a.remarks') patch.remarks = v;
        else if (c.key && c.key.startsWith('x:') && (c.input === 'number' || c.input === 'text')) patch.x[c.key] = c.input === 'number' ? numOf(v) : v;
        else if (c.key && c.key.startsWith('x:') && c.input === 'check') patch.x[c.key] = truthy(v);
      }
      cls.learners.push(l);
      setResult(state, l.id, period, lang, patch);
      added.push(l);
    }
    return added;
  }
  function setExtra(state, learnerId, period, lang, key, value) {
    const cur = result(state, learnerId, period, lang);
    setResult(state, learnerId, period, lang, { x: Object.assign({}, cur.x || {}, { [key]: value }) });
  }

  // ---------- samples ----------
  function sampleState() {
    const st = emptyState();
    st.sample = true;
    st.school = {
      name: 'Sample National High School', id: '300000', district: 'Sample District', division: 'Sample Division',
      region: 'Region V', head: 'MARIA L. SANTOS', chair: 'JOSE R. REYES', coordinator: 'ANA B. CRUZ',
    };
    const names = [
      ['Abad', 'Carlo', 'Mendoza', 'M'], ['Bautista', 'Liza', 'Ramos', 'F'], ['Castillo', 'Mark', 'Dizon', 'M'],
      ['Dela Cruz', 'Angela', 'Perez', 'F'], ['Estrada', 'John Paul', 'Lim', 'M'], ['Fernandez', 'Kristine', 'Gomez', 'F'],
      ['Garcia', 'Miguel', 'Torres', 'M'], ['Hernandez', 'Joy', 'Aquino', 'F'], ['Ignacio', 'Ramon', 'Cruz', 'M'],
      ['Jimenez', 'Patricia', 'Soriano', 'F'], ['Lopez', 'Daniel', 'Navarro', 'M'], ['Mercado', 'Rhea', 'Santos', 'F'],
    ];
    const mk = (grade, section, adviser, offset) => ({
      id: uid('c'), sy: st.sy, grade, section, adviser, designation: 'Teacher I',
      learners: names.map((n, i) => ({
        id: uid('l'), lrn: String(1300000000 + offset * 100 + i).padStart(12, '1'),
        last: n[0], first: n[1], middle: n[2], ext: '', sex: n[3],
