<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <title>Phil-IRI Recorder</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 7.5c3.6-1.2 7-.9 10 1.2 3-2.1 6.4-2.4 10-1.2v17c-3.6-1.2-7-.9-10 1.2-3-2.1-6.4-2.4-10-1.2z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 8.7v17" stroke="currentColor" stroke-width="2.2"/></svg></span>
      <div>
        <div class="brand-name">Phil-IRI Recorder</div>
        <div class="brand-sy" id="brand-sy"></div>
      </div>
    </div>
    <div class="topbar-files" id="topbar-files"></div>
    <div class="topbar-actions" id="topbar-actions">
      <button class="btn quiet" type="button" data-act="go-settings" id="settings-btn">Settings</button>
    </div>
  </header>
  <main class="main">
    <div id="view"></div>
    <p class="foot muted small" id="rail-foot"></p>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<!-- PDF reader worker: kept as text and started only when a PDF is opened -->
<script type="text/plain" id="pdf-worker-src" data-src="vendor/pdf.worker.min.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/detect.js"></script>
<script src="js/data.js"></script>
<script src="js/samples.js"></script>
<script src="js/doctext.js"></script>
<script src="js/app.js"></script>
</body>
</html>
