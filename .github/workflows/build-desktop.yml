name: Build Windows app

# Runs only when started by hand (Actions tab › Build Windows app › Run workflow).
# Automatic builds on every push filled the GitHub storage (about 188 MB each).
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Phil-IRI-Recorder-Windows
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 7
